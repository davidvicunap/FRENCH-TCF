exte précise deux catégories : « les habitants de la commune » ET « les moins de 26 ans ». Il faut lire les deux conditions, reliées par « et ».","from":"lesson","lesson":"ce/l1","whyEn":"Two groups get free membership: town residents AND under-26s."},{"kind":"other","status":"reviewed","id":"ce-3","level":"B1","context":"De : service-clients@voyaz.fr\\nÀ : m.durand@courriel.fr\\nObjet : Votre réservation n° 4471\\n\\nMadame, Monsieur,\\n\\nNous vous informons que votre vol Paris–Montréal du 14 mars a été modifié. Le départ est avancé de 11 h 20 à 9 h 45. Aucune démarche n'est nécessaire de votre part : votre billet reste valable.\\n\\nSi ce nouvel horaire ne vous convient pas, vous pouvez demander un remboursement intégral avant le 1er mars en répondant à ce message.\\n\\nCordialement,\\nLe service clients","q":"Que doit faire le client s'il accepte le nouvel horaire ?","options":["Répondre au message avant le 1er mars","Rien du tout : son billet reste valable","Réserver un nouveau billet","Se présenter à l'aéroport trois heures avant"],"a":1,"why":"Le message précise : « Aucune démarche n'est nécessaire de votre part : votre billet reste valable. » La réponse avant le 1er mars ne concerne que le cas d'un REFUS du nouvel horaire.","gloss":"Classic trap: the deadline in the text applies to the other scenario.","from":"lesson","lesson":"ce/l1","whyEn":"If you accept the new time, do nothing: the ticket stays valid. The 1 March deadline is only for a refund."},{"kind":"other","status":"reviewed","id":"ce-4","level":"B1","context":"De : service-clients@voyaz.fr\\nÀ : m.durand@courriel.fr\\nObjet : Votre réservation n° 4471\\n\\nMadame, Monsieur,\\n\\nNous vous informons que votre vol Paris–Montréal du 14 mars a été modifié. Le départ est avancé de 11 h 20 à 9 h 45. Aucune démarche n'est nécessaire de votre part : votre billet reste valable.\\n\\nSi ce nouvel horaire ne vous convient pas, vous pouvez demander un remboursement intégral avant le 1er mars en répondant à ce message.\\n\\nCordialement,\\nLe service clients","q":"Que s'est-il passé avec le vol ?","options":["Il a été annulé","Il partira plus tôt que prévu","Il partira plus tard que prévu","Sa destination a changé"],"a":1,"why":"« Le départ est AVANCÉ de 11 h 20 à 9 h 45 » : avancer un horaire, c'est le rendre plus tôt. « Retardé » ou « reporté » signifierait l'inverse.","gloss":"avancer = to bring forward; retarder = to push back.","from":"lesson","lesson":"ce/l1","whyEn":"« avancé » means brought forward: the flight leaves earlier (9:45 instead of 11:20)."},{"kind":"other","status":"reviewed","id":"ce-5","level":"B2","context":"Le télétravail s'est imposé en quelques mois comme une évidence. Certes, il a permis à des millions de salariés d'économiser un temps de transport considérable et de mieux organiser leurs journées. Mais on aurait tort de n'y voir qu'un progrès.\\n\\nÀ mesure que le bureau entre dans le salon, la frontière entre vie professionnelle et vie privée s'efface. Les études le montrent : les salariés en télétravail travaillent en moyenne plus longtemps, et se déconnectent plus difficilement. Les plus jeunes, privés des échanges informels qui font l'apprentissage d'un métier, en paient le prix le plus fort.\\n\\nLa vraie question n'est donc pas de savoir s'il faut télétravailler, mais à quelles conditions.","q":"Quelle est l'opinion de l'auteur sur le télétravail ?","options":["Il y est totalement opposé","Il le considère comme un progrès sans réserve","Il en reconnaît les avantages mais insiste sur ses risques","Il estime que le sujet n'a aucune importance"],"a":2,"why":"L'auteur emploie la structure « Certes… Mais… » : il concède les avantages (temps de transport) avant d'exposer sa véritable thèse, les risques (effacement de la frontière vie privée / vie professionnelle). Sa position est donc nuancée, ni pour ni contre.","from":"lesson","lesson":"ce/l2","whyEn":"« Certes… mais » — the author admits the advantages but stresses the risks: a nuanced view."},{"kind":"other","status":"reviewed","id":"ce-6","level":"B2","context":"Le télétravail s'est imposé en quelques mois comme une évidence. Certes, il a permis à des millions de salariés d'économiser un temps de transport considérable et de mieux organiser leurs journées. Mais on aurait tort de n'y voir qu'un progrès.\\n\\nÀ mesure que le bureau entre dans le salon, la frontière entre vie professionnelle et vie privée s'efface. Les études le montrent : les salariés en télétravail travaillent en moyenne plus longtemps, et se déconnectent plus difficilement. Les plus jeunes, privés des échanges informels qui font l'apprentissage d'un métier, en paient le prix le plus fort.\\n\\nLa vraie question n'est donc pas de savoir s'il faut télétravailler, mais à quelles conditions.","q":"Selon le texte, qui est le plus pénalisé par le télétravail ?","options":["Les cadres dirigeants","Les salariés les plus jeunes","Les personnes vivant loin de leur travail","Les employeurs"],"a":1,"why":"Le texte précise : « Les plus jeunes, privés des échanges informels qui font l'apprentissage d'un métier, en paient le prix le plus fort. »","from":"lesson","lesson":"ce/l2","whyEn":"The text says the youngest workers « pay the highest price »."},{"kind":"other","status":"reviewed","id":"ce-7","level":"C1","context":"Le télétravail s'est imposé en quelques mois comme une évidence. Certes, il a permis à des millions de salariés d'économiser un temps de transport considérable et de mieux organiser leurs journées. Mais on aurait tort de n'y voir qu'un progrès.\\n\\nÀ mesure que le bureau entre dans le salon, la frontière entre vie professionnelle et vie privée s'efface. Les études le montrent : les salariés en télétravail travaillent en moyenne plus longtemps, et se déconnectent plus difficilement. Les plus jeunes, privés des échanges informels qui font l'apprentissage d'un métier, en paient le prix le plus fort.\\n\\nLa vraie question n'est donc pas de savoir s'il faut télétravailler, mais à quelles conditions.","q":"Que signifie la dernière phrase du texte ?","options":["Le débat sur le télétravail est définitivement clos","Il faudrait interdire le télétravail dans certains secteurs","Le débat doit porter sur les modalités du télétravail, non sur son principe","Les entreprises devraient laisser chaque salarié décider seul"],"a":2,"why":"« Non pas s'il faut télétravailler, mais à quelles conditions » déplace le débat : le principe est acquis, ce qui reste à discuter, ce sont les modalités (encadrement, droit à la déconnexion, accompagnement des jeunes).","from":"lesson","lesson":"ce/l2","whyEn":"The debate is no longer whether to telework, but under what conditions."},{"kind":"other","status":"reviewed","id":"x-ce-01","level":"A1","context":"BOULANGERIE DU MARCHÉ\\nOuvert du mardi au dimanche\\nde 7 h à 13 h\\nFermé le lundi","q":"Quel jour la boulangerie est-elle fermée ?","options":["Le dimanche","Le lundi","Le mardi","Le samedi"],"a":1,"why":"Le panneau indique « Fermé le lundi ».","from":"bank","whyEn":"The sign says « Fermé le lundi » — closed on Monday."},{"kind":"other","status":"reviewed","id":"x-ce-02","level":"A1","context":"Salut Tom,\\nJe suis au supermarché. Tu veux quelque chose ?\\nRéponds-moi vite !\\nLéa","q":"Pourquoi Léa écrit-elle à Tom ?","options":["Pour l'inviter au restaurant","Pour savoir s'il a besoin de quelque chose","Pour lui demander de l'argent","Pour annuler un rendez-vous"],"a":1,"why":"Léa est au supermarché et demande : « Tu veux quelque chose ? »","from":"bank","whyEn":"Léa is at the supermarket and asks if Tom wants anything."},{"kind":"other","status":"reviewed","id":"x-ce-03","level":"A1","context":"À VENDRE\\nVélo bleu pour enfant (6–8 ans)\\nTrès bon état — 40 euros\\nTéléphone : 06 12 34 56 78","q":"Que propose cette annonce ?","options":["La location d'un vélo","La vente d'un vélo d'enfant","La réparation de vélos","Un cours de vélo"],"a":1,"why":"« À vendre : vélo bleu pour enfant » : il s'agit de la vente d'un vélo d'enfant.","from":"bank","whyEn":"« À vendre » = for sale: a child's bike."},{"kind":"other","status":"reviewed","id":"x-ce-04","level":"A1","context":"CINÉMA LE REX\\nTarif normal : 9 euros\\nÉtudiants et moins de 18 ans : 6 euros\\nLe mercredi : 5 euros pour tous","q":"Combien paie un adulte le mercredi ?","options":["5 euros","6 euros","9 euros","Rien"],"a":0,"why":"Le mercredi, le tarif est de « 5 euros pour tous », donc aussi pour un adulte.","from":"bank","whyEn":"On Wednesdays it is 5 euros for everyone, adults included."},{"kind":"other","status":"reviewed","id":"x-ce-05","level":"A2","context":"Bonjour Madame Petit,\\n\\nJe vous écris pour vous informer que mon fils Hugo sera absent demain matin : il a rendez-vous chez le dentiste à 9 h. Il reviendra à l'école pour le déjeuner.\\n\\nCordialement,\\nClaire Morel","q":"Quand Hugo retournera-t-il à l'école ?","options":["Demain à 9 h","Demain, pour le repas de midi","Après-demain","La semaine prochaine"],"a":1,"why":"« Il reviendra à l'école pour le déjeuner » : il sera de retour à midi, après son rendez-vous du matin.","from":"bank","whyEn":"Hugo comes back to school for lunch, after the dentist."},{"kind":"other","status":"reviewed","id":"x-ce-06","level":"A2","context":"PISCINE MUNICIPALE — RÈGLEMENT\\n• Le bonnet de bain est obligatoire.\\n• Les enfants de moins de 10 ans doivent être accompagnés d'un adulte.\\n• Il est interdit de manger au bord des bassins.\\n• Douche obligatoire avant la baignade.","q":"Que doit faire un enfant de 8 ans pour entrer ?","options":["Venir avec un adulte","Présenter une carte d'identité","Payer un supplément","Savoir nager"],"a":0,"why":"« Les enfants de moins de 10 ans doivent être accompagnés d'un adulte » : un enfant de 8 ans ne peut pas entrer seul.","from":"bank","whyEn":"Children under 10 must come with an adult."},{"kind":"other","status":"reviewed","id":"x-ce-07","level":"A2","context":"Résidence Les Tilleuls\\n\\nAVIS AUX HABITANTS\\nL'ascenseur sera en panne du lundi 3 au mercredi 5 mars pour travaux d'entretien. Merci d'utiliser les escaliers. Nous nous excusons pour la gêne occasionnée.\\n\\nLe gardien","q":"Que doivent faire les habitants pendant trois jours ?","options":["Quitter l'immeuble","Monter à pied","Appeler le gardien avant de sortir","Payer les travaux"],"a":1,"why":"L'ascenseur est hors service : « Merci d'utiliser les escaliers ». Les habitants doivent donc monter à pied.","from":"bank","whyEn":"The lift is out of order: residents must take the stairs."},{"kind":"other","status":"reviewed","id":"x-ce-08","level":"A2","context":"Cherche personne sérieuse pour garder deux enfants (4 et 7 ans) le mercredi après-midi, de 13 h à 18 h. Aller les chercher à l'école, aide aux devoirs. Expérience souhaitée. 12 euros de l'heure. Écrire à famille.roux@courriel.fr","q":"Que recherche cette famille ?","options":["Un professeur de mathématiques","Une personne pour s'occuper des enfants une fois par semaine","Un chauffeur à plein temps","Une femme de ménage"],"a":1,"why":"L'annonce cherche quelqu'un « pour garder deux enfants le mercredi après-midi » : une garde d'enfants hebdomadaire.","from":"bank","whyEn":"They need someone to look after two children on Wednesday afternoons."},{"kind":"other","status":"reviewed","id":"x-ce-09","level":"B1","context":"Objet : Votre abonnement\\n\\nMadame, Monsieur,\\n\\nVotre abonnement à notre salle de sport arrive à échéance le 30 juin. Sans réponse de votre part avant cette date, il sera renouvelé automatiquement pour un an, au tarif de 39 euros par mois.\\n\\nSi vous ne souhaitez pas le prolonger, il vous suffit de nous envoyer un courriel au plus tard le 15 juin.\\n\\nSportivement,\\nL'équipe Tonic Club","q":"Que se passe-t-il si le client ne fait rien ?","options":["Son abonnement s'arrête le 30 juin","Son abonnement est prolongé d'un an","Il reçoit un remboursement","Il doit payer une amende"],"a":1,"why":"« Sans réponse de votre part […], il sera renouvelé automatiquement pour un an. » Ne rien faire, c'est accepter le renouvellement.","from":"bank","whyEn":"Doing nothing means the membership renews automatically for a year."},{"kind":"other","status":"reviewed","id":"x-ce-10","level":"B1","context":"Avis de Nadia — ★★☆☆☆\\n\\nL'hôtel est bien situé, à deux pas de la plage, et le personnel est aimable. Malheureusement, notre chambre donnait sur une rue très passante et nous avons mal dormi. De plus, le petit-déjeuner, annoncé comme « copieux », se limitait à du pain et du café. Pour ce prix, nous attendions mieux.","q":"Que reproche Nadia à l'hôtel ?","options":["Son emplacement et l'accueil","Le bruit et la qualité du petit-déjeuner","La saleté de la chambre","L'éloignement de la plage"],"a":1,"why":"Nadia apprécie l'emplacement et le personnel, mais critique la chambre bruyante (« une rue très passante ») et un petit-déjeuner décevant.","from":"bank","whyEn":"She criticises the noise and the poor breakfast, not the location or staff."},{"kind":"other","status":"reviewed","id":"x-ce-11","level":"B1","context":"La mairie lance une collecte de vêtements du 10 au 20 novembre. Vous pouvez déposer manteaux, pulls et chaussures en bon état dans le hall de l'hôtel de ville, du lundi au vendredi. Les dons seront remis à une association qui les distribuera aux familles en difficulté avant l'hiver. Les vêtements déchirés ou sales ne seront pas acceptés.","q":"Quel est l'objectif de cette opération ?","options":["Vendre des vêtements d'occasion","Aider des familles à s'habiller pour l'hiver","Recycler de vieux tissus","Organiser un défilé de mode"],"a":1,"why":"Les dons « seront remis à une association qui les distribuera aux familles en difficulté avant l'hiver » : c'est une action de solidarité.","from":"bank","whyEn":"The clothes go to families in need before winter."},{"kind":"other","status":"reviewed","id":"x-ce-12","level":"B1","context":"Chère Élise,\\n\\nJe suis bien arrivée à Montréal. Les premiers jours ont été compliqués : ma valise est restée à Paris et je n'ai pu la récupérer qu'au bout d'une semaine. Heureusement, ma colocataire m'a prêté des vêtements. Depuis, tout va mieux : j'ai commencé mes cours lundi et les étudiants sont très accueillants.\\n\\nJe t'embrasse,\\nManon","q":"Quel problème Manon a-t-elle rencontré à son arrivée ?","options":["Elle n'avait pas de logement","Ses bagages ne sont pas arrivés avec elle","Elle a raté son avion","Ses cours ont été annulés"],"a":1,"why":"« Ma valise est restée à Paris et je n'ai pu la récupérer qu'au bout d'une semaine » : ses bagages n'ont pas suivi.","from":"bank","whyEn":"Her suitcase stayed in Paris for a week."},{"kind":"other","status":"reviewed","id":"x-ce-13","level":"B1","context":"De plus en plus de Français choisissent de faire réparer leurs appareils plutôt que de les remplacer. Dans les « cafés de réparation », des bénévoles aident gratuitement les habitants à remettre en état un grille-pain, un téléphone ou un vélo. On y vient pour économiser de l'argent, mais aussi pour réduire ses déchets et rencontrer ses voisins.","q":"Pourquoi les gens fréquentent-ils ces cafés ?","options":["Pour acheter des appareils neufs moins chers","Pour des raisons économiques, écologiques et sociales","Pour apprendre un métier","Pour vendre leurs vieux objets"],"a":1,"why":"Le texte cite trois raisons : « économiser de l'argent », « réduire ses déchets » et « rencontrer ses voisins ».","from":"bank","whyEn":"Three reasons: saving money, cutting waste, meeting neighbours."},{"kind":"other","status":"reviewed","id":"x-ce-14","level":"B2","context":"Longtemps réservé aux grandes villes, le vélo en libre-service gagne désormais les communes moyennes. Le bilan est pourtant contrasté. Là où les pistes cyclables ont été aménagées en amont, le succès est réel. Ailleurs, les vélos restent sur leurs bornes : les habitants, peu rassurés par la circulation, ne changent pas leurs habitudes. Les élus découvrent qu'il ne suffit pas d'offrir un service pour créer un usage.","q":"Que montre l'expérience des communes moyennes ?","options":["Le vélo en libre-service réussit partout","Sans aménagements cyclables, le service est peu utilisé","Les habitants préfèrent acheter leur propre vélo","Les élus veulent supprimer ces services"],"a":1,"why":"Le succès dépend des pistes cyclables « aménagées en amont ». Ailleurs, les vélos ne sont pas utilisés, car les habitants craignent la circulation.","from":"bank","whyEn":"Bike sharing only works where cycle lanes were built first."},{"kind":"other","status":"reviewed","id":"x-ce-15","level":"B2","context":"Certes, les supermarchés ont fait des efforts pour réduire le plastique, et l'on ne peut que s'en féliciter. Mais remplacer un sachet par une barquette en carton, elle-même enveloppée d'un film, relève davantage de la communication que de l'écologie. Tant que les produits continueront de parcourir des milliers de kilomètres, l'emballage restera le détail qui cache l'essentiel.","q":"Quelle est l'opinion de l'auteur ?","options":["Les supermarchés ont résolu le problème du plastique","Les efforts sur les emballages détournent l'attention du vrai problème","Le carton pollue davantage que le plastique","Il faut interdire tous les emballages"],"a":1,"why":"Après la concession (« Certes… »), l'auteur donne sa thèse : ces changements relèvent « de la communication », et l'emballage est « le détail qui cache l'essentiel », le transport des produits.","from":"bank","whyEn":"After « certes », the author argues packaging changes are mostly PR and hide the real issue (transport)."},{"kind":"other","status":"reviewed","id":"x-ce-16","level":"B2","context":"Une enquête menée auprès de 2 000 salariés révèle un paradoxe. Près de 70 % d'entre eux se disent satisfaits de leur travail ; pourtant, un sur deux affirme qu'il changerait de poste s'il en avait la possibilité. Pour les chercheurs, cette contradiction n'est qu'apparente : on peut aimer son métier tout en souffrant de ses conditions d'exercice, qu'il s'agisse des horaires, du salaire ou du manque de reconnaissance.","q":"Comment les chercheurs expliquent-ils ce paradoxe ?","options":["Les salariés ont menti aux enquêteurs","On peut apprécier son métier sans apprécier ses conditions de travail","La majorité des salariés détestent leur travail","Les salariés satisfaits sont les mieux payés"],"a":1,"why":"Pour les chercheurs, « on peut aimer son métier tout en souffrant de ses conditions d'exercice » : la contradiction n'est qu'apparente.","from":"bank","whyEn":"You can like your job and still dislike your working conditions."},{"kind":"other","status":"reviewed","id":"x-ce-17","level":"B2","context":"Le succès des podcasts tient moins à la nouveauté du format qu'à la place qu'il a su prendre dans nos journées. On l'écoute en cuisinant, en courant, dans les transports — autant de moments où lire est impossible et où l'écran fatigue. Là où la télévision exige qu'on s'arrête, le podcast accompagne. Il ne vole pas de temps : il occupe celui qui était perdu.","q":"Selon l'auteur, pourquoi les podcasts ont-ils du succès ?","options":["Parce que leur format est entièrement nouveau","Parce qu'ils s'écoutent pendant d'autres activités","Parce qu'ils sont plus courts que les émissions de télévision","Parce qu'ils sont gratuits"],"a":1,"why":"Le podcast « accompagne » : on l'écoute en cuisinant, en courant, dans les transports. Il occupe un temps « qui était perdu ».","from":"bank","whyEn":"Podcasts fill moments when you are doing something else."},{"kind":"other","status":"reviewed","id":"x-ce-18","level":"B2","context":"Chers collègues,\\n\\nÀ la suite de plusieurs remarques, je souhaite rappeler que la salle de réunion du deuxième étage doit être réservée au moins 24 heures à l'avance sur l'intranet. Trop souvent, des équipes se retrouvent devant une porte fermée ou une salle déjà occupée. À compter de lundi, toute réunion non enregistrée pourra être déplacée sans préavis au profit d'une réunion réservée.\\n\\nMerci de votre compréhension,\\nLa direction","q":"Qu'est-ce qui change à partir de lundi ?","options":["La salle de réunion sera fermée","Une réunion non réservée pourra perdre la salle","Il faudra réserver une semaine à l'avance","Les réunions seront limitées à une heure"],"a":1,"why":"« Toute réunion non enregistrée pourra être déplacée sans préavis au profit d'une réunion réservée » : sans réservation, on risque de perdre la salle.","from":"bank","whyEn":"From Monday, an unbooked meeting can lose the room."},{"kind":"other","status":"reviewed","id":"x-ce-19","level":"C1","context":"On aurait tort de réduire l'engouement pour les jardins partagés à une mode citadine. Derrière le plaisir de cultiver quelques tomates se joue une forme discrète de réappropriation : celle d'un espace que la ville avait rendu purement fonctionnel, et d'un temps soustrait à la logique du rendement. Qu'importe, au fond, que la récolte soit maigre ; ce que ces jardiniers viennent chercher ne se pèse pas.","q":"Que veut dire l'auteur dans la dernière phrase ?","options":["Ces jardins ne produisent pas assez pour être utiles","L'intérêt de ces jardins n'est pas dans la quantité récoltée","Les jardiniers devraient mesurer leur production","Les récoltes sont trop légères pour être vendues"],"a":1,"why":"« Ce que ces jardiniers viennent chercher ne se pèse pas » : la valeur de l'expérience (espace retrouvé, temps libéré) n'est pas mesurable en kilos de légumes.","from":"bank","whyEn":"What these gardeners look for cannot be measured in kilos."},{"kind":"other","status":"reviewed","id":"x-ce-20","level":"C1","context":"La prétendue « fuite des cerveaux » mérite d'être nuancée. S'il est exact que de jeunes diplômés partent travailler à l'étranger, la plupart reviennent au bout de quelques années, forts d'une expérience et d'un réseau dont leur pays d'origine tire ensuite profit. Plutôt que de déplorer ces départs, mieux vaudrait se demander ce qui est fait pour faciliter les retours.","q":"Quelle est la position de l'auteur sur la « fuite des cerveaux » ?","options":["C'est une catastrophe qu'il faut empêcher","Le phénomène est exagéré et l'enjeu réel est le retour des diplômés","Les diplômés ne devraient jamais revenir","Le phénomène n'existe pas du tout"],"a":1,"why":"« Prétendue » et « mérite d'être nuancée » marquent la distance de l'auteur. Il reconnaît les départs, mais déplace la question vers les conditions du retour.","from":"bank","whyEn":"« Prétendue » shows doubt: the real issue is helping graduates come back."},{"kind":"other","status":"reviewed","id":"x-ce-21","level":"C1","context":"Le ministre a salué, je cite, « une réforme courageuse et attendue ». Courageuse, sans doute — il en faut, du courage, pour annoncer une hausse des tarifs à trois mois d'une élection. Attendue, c'est moins certain : on cherche encore, parmi les usagers, ceux qui la réclamaient.","q":"Quel est le ton de ce passage ?","options":["Neutre et informatif","Ironique et critique","Enthousiaste","Résigné"],"a":1,"why":"L'auteur reprend les mots du ministre pour les retourner contre lui : le « courage » est celui d'annoncer une mesure impopulaire, et personne ne la « réclamait ». Le ton est ironique.","from":"bank","whyEn":"The author turns the minister's words against him: ironic and critical."},{"kind":"other","status":"reviewed","id":"x-ce-22","level":"C1","context":"Longtemps, l'orthographe a servi de frontière sociale : la faute désignait celui qui n'avait pas fait les « bonnes » études. Les correcteurs automatiques auraient pu abolir cette frontière. Ils l'ont déplacée. Ce qui distingue désormais, ce n'est plus de savoir écrire sans faute, mais de savoir quand la machine se trompe — compétence qui suppose précisément la maîtrise qu'elle était censée rendre inutile.","q":"Quelle idée l'auteur défend-il ?","options":["Les correcteurs automatiques ont supprimé les inégalités face à l'orthographe","Les correcteurs n'ont pas fait disparaître l'avantage de ceux qui maîtrisent la langue","Il faut interdire les correcteurs à l'école","L'orthographe n'a plus aucune importance"],"a":1,"why":"La frontière sociale n'a pas été abolie mais « déplacée » : repérer les erreurs de la machine exige justement de maîtriser l'orthographe.","from":"bank","whyEn":"Spell-checkers moved the advantage: you must master spelling to spot their errors."},{"kind":"other","status":"reviewed","id":"x-ce-23","level":"C2","context":"Il n'est pas de formule plus commode, ni de plus trompeuse, que celle qui oppose la tradition à la modernité. Car ce que nous appelons tradition n'est bien souvent qu'une innovation qui a réussi à faire oublier sa date de naissance ; et ce que nous célébrons comme moderne, une vieille idée qui a changé de costume. À y regarder de près, l'une n'en finit pas de se déguiser en l'autre.","q":"Que soutient l'auteur ?","options":["La tradition doit être défendue contre la modernité","L'opposition entre tradition et modernité est largement illusoire","La modernité finira par faire disparaître les traditions","Les traditions sont toujours plus anciennes qu'on ne le croit"],"a":1,"why":"L'opposition est dite « trompeuse » : la tradition est une ancienne innovation, la modernité une vieille idée renouvelée. Les deux notions se confondent sans cesse.","from":"bank","whyEn":"Tradition and modernity constantly turn into each other: the contrast is an illusion."},{"kind":"other","status":"reviewed","id":"x-ce-24","level":"C2","context":"On reproche volontiers aux experts de se contredire, comme si le désaccord trahissait l'incompétence. C'est méconnaître la nature même du savoir, qui ne progresse qu'en se disputant. Le véritable motif d'inquiétude serait plutôt l'unanimité : là où plus personne n'objecte, il y a fort à parier que l'on a cessé de chercher.","q":"Selon l'auteur, que révèle le désaccord entre experts ?","options":["Leur manque de compétence","Le fonctionnement normal de la recherche","Leur volonté de tromper le public","L'inutilité de leurs travaux"],"a":1,"why":"Le savoir « ne progresse qu'en se disputant » : le désaccord est normal. C'est l'unanimité qui devrait inquiéter, car elle signale que l'on a « cessé de chercher ».","from":"bank","whyEn":"Disagreement is how knowledge progresses; unanimity is the warning sign."},{"kind":"other","status":"reviewed","id":"x-ce-25","level":"C2","context":"L'auteur a beau se défendre d'avoir écrit un roman à thèse, chaque page plaide. Les personnages n'existent guère que pour avoir tort ou raison, et le lecteur, dûment informé de ce qu'il convient de penser, referme le livre avec le sentiment d'avoir assisté à un procès dont le verdict était rédigé d'avance. On regrette d'autant plus ce parti pris que le style, lui, ne manque ni de nerf ni d'élégance.","q":"Quel jugement le critique porte-t-il sur ce roman ?","options":["Un livre remarquable en tous points","Une écriture de qualité au service d'une démonstration trop appuyée","Un livre mal écrit mais passionnant","Un roman sans aucune idée"],"a":1,"why":"Le critique reproche au roman de « plaider » à chaque page, avec un verdict « rédigé d'avance », tout en reconnaissant un style qui « ne manque ni de nerf ni d'élégance ».","from":"bank","whyEn":"Elegant writing serving a heavy-handed, pre-judged argument."}]`),h=JSON.parse(`[{"id":"r-a1-01","level":"A1","kind":"notice","context":"PHARMACIE CENTRALE\\nOuverte 7 jours sur 7\\nDu lundi au samedi : 8 h 30 – 20 h\\nDimanche : 9 h – 13 h","q":"À quelle heure la pharmacie ferme-t-elle le dimanche ?","options":["À 13 h","À 20 h","À 8 h 30","À 9 h"],"a":0,"why":"Pour le dimanche, l'affiche indique « 9 h – 13 h » : la pharmacie ferme à 13 h.","whyEn":"Sunday hours are 9:00–13:00, so it closes at 1 p.m.","notes":["Correct: Sunday is 9 h – 13 h.","20 h is the closing time Monday to Saturday.","8 h 30 is the weekday opening time.","9 h is when it opens on Sunday, not when it closes."],"glossary":[{"fr":"ouvert(e)","en":"open"},{"fr":"fermer","en":"to close"},{"fr":"7 jours sur 7","en":"every day of the week"}]},{"id":"r-a1-02","level":"A1","kind":"message","context":"Coucou !\\nJe suis en retard, le bus ne passe pas. J'arrive dans 20 minutes.\\nTu peux commander pour moi ? Une pizza et un jus d'orange.\\nBisous,\\nInès","q":"Que demande Inès ?","options":["De commander son repas","D'aller la chercher en voiture","D'annuler le dîner","D'attendre le bus avec elle"],"a":0,"why":"Inès écrit : « Tu peux commander pour moi ? Une pizza et un jus d'orange. »","whyEn":"She asks her friend to order for her: a pizza and an orange juice.","notes":["Correct: « commander pour moi ».","She never asks to be picked up; she is coming by bus.","She is late, but she is still coming.","The bus is mentioned only to explain why she is late."],"glossary":[{"fr":"en retard","en":"late"},{"fr":"commander","en":"to order"},{"fr":"Bisous","en":"Love / kisses (informal sign-off)"}]},{"id":"r-a1-03","level":"A1","kind":"ad","context":"À LOUER\\nStudio meublé, 25 m², centre-ville\\n650 $ par mois, chauffage compris\\nLibre le 1er juillet\\nAppeler Marc : 514 555-0142","q":"Qu'est-ce qui est compris dans le prix ?","options":["Le chauffage","Internet","Le stationnement","Le téléphone"],"a":0,"why":"L'annonce précise « chauffage compris » : le chauffage est inclus dans les 650 $.","whyEn":"« chauffage compris » means heating is included in the rent.","notes":["Correct: « chauffage compris ».","Internet is not mentioned.","Parking is not mentioned.","The phone number is for contacting Marc, not a service included."],"glossary":[{"fr":"à louer","en":"for rent"},{"fr":"meublé","en":"furnished"},{"fr":"compris","en":"included"},{"fr":"libre","en":"available"}]},{"id":"r-a1-04","level":"A1","kind":"notice","context":"ÉCOLE DES PINS\\nRéunion des parents d'élèves\\nJeudi 12 octobre, 18 h\\nSalle 4 (rez-de-chaussée)","q":"Qui est invité à cette réunion ?","options":["Les parents des élèves","Les enseignants seulement","Les enfants","Les voisins de l'école"],"a":0,"why":"Il s'agit d'une « réunion des parents d'élèves ».","whyEn":"It is a meeting for the parents of the pupils.","notes":["Correct: « parents d'élèves ».","Teachers are not mentioned.","« élèves » refers to the parents' children; the children are not invited.","Neighbours are not mentioned."],"glossary":[{"fr":"une réunion","en":"a meeting"},{"fr":"un élève","en":"a pupil"},{"fr":"le rez-de-chaussée","en":"the ground floor"}]},{"id":"r-a1-05","level":"A1","kind":"email","context":"Bonjour Paul,\\nMerci pour ton invitation !\\nSamedi, je ne peux pas : je travaille.\\nDimanche, c'est possible pour moi. Ça te va ?\\nAnna","q":"Quand Anna est-elle disponible ?","options":["Samedi","Dimanche","Samedi et dimanche","Elle n'est pas disponible"],"a":1,"why":"Anna travaille samedi, mais elle écrit : « Dimanche, c'est possible pour moi. »","whyEn":"She works on Saturday; Sunday is possible.","notes":["She works on Saturday: « je ne peux pas ».","Correct.","Only Sunday works for her.","She is free on Sunday."],"glossary":[{"fr":"je ne peux pas","en":"I can't"},{"fr":"Ça te va ?","en":"Does that suit you?"}]},{"id":"r-a1-06","level":"A1","kind":"notice","context":"MENU DU JOUR — 15 $\\nSoupe de légumes\\nPoulet et frites OU poisson et riz\\nDessert : tarte aux pommes\\nCafé non compris","q":"Qu'est-ce qui n'est pas inclus dans le menu à 15 $ ?","options":["La soupe","Le dessert","Le café","Le plat principal"],"a":2,"why":"La dernière ligne indique « Café non compris » : il faut le payer en plus.","whyEn":"« Café non compris » = coffee is not included.","notes":["The soup is part of the menu.","The apple pie dessert is included.","Correct: « non compris ».","Chicken or fish is the main course, included."],"glossary":[{"fr":"non compris","en":"not included"},{"fr":"ou","en":"or"},{"fr":"une tarte aux pommes","en":"an apple pie"}]},{"id":"r-a2-01","level":"A2","kind":"notice","context":"BIBLIOTHÈQUE MUNICIPALE\\nVous pouvez emprunter 5 livres pendant 3 semaines.\\nDVD : 2 au maximum, pour 1 semaine.\\nEn cas de retard : 0,25 $ par jour et par document.","q":"Combien de temps peut-on garder un DVD ?","options":["Une semaine","Trois semaines","Cinq jours","Deux semaines"],"a":0,"why":"Pour les DVD, le règlement indique « pour 1 semaine ».","whyEn":"DVDs can be kept for one week.","notes":["Correct: « pour 1 semaine ».","Three weeks is for books.","5 is the number of books, not days.","2 is the maximum number of DVDs, not weeks."],"glossary":[{"fr":"emprunter","en":"to borrow"},{"fr":"un retard","en":"a late return / delay"},{"fr":"au maximum","en":"at most"}]},{"id":"r-a2-02","level":"A2","kind":"email","context":"Objet : Votre premier jour\\n\\nBonjour Madame Lopez,\\n\\nNous sommes heureux de vous accueillir lundi prochain. Merci de vous présenter à l'accueil à 8 h 45 avec une pièce d'identité et votre numéro d'assurance sociale. Le repas de midi vous sera offert.\\n\\nÀ lundi,\\nJulien Roy, Ressources humaines","q":"Que doit apporter Madame Lopez ?","options":["Des documents personnels","Son repas de midi","Un ordinateur","Une lettre de motivation"],"a":0,"why":"Elle doit venir « avec une pièce d'identité et [son] numéro d'assurance sociale » : ce sont des documents personnels.","whyEn":"She must bring ID and her social insurance number — personal documents.","notes":["Correct: ID + social insurance number.","Lunch is offered: « vous sera offert ».","A computer is not mentioned.","She already has the job; no cover letter needed."],"glossary":[{"fr":"accueillir","en":"to welcome"},{"fr":"une pièce d'identité","en":"an ID document"},{"fr":"offert","en":"provided free"}]},{"id":"r-a2-03","level":"A2","kind":"ad","context":"COURS DE NATATION POUR ADULTES\\nDébutants : mardi et jeudi, 19 h – 20 h\\nNiveau avancé : samedi, 10 h – 11 h 30\\nInscription obligatoire à l'accueil de la piscine\\n10 séances : 120 $","q":"Un adulte qui ne sait pas nager peut suivre un cours…","options":["le mardi soir","le samedi matin","tous les jours","sans s'inscrire"],"a":0,"why":"Une personne qui ne sait pas nager est « débutante » : ses cours ont lieu le mardi et le jeudi, de 19 h à 20 h.","whyEn":"Someone who can't swim is a beginner: Tuesday and Thursday evenings.","notes":["Correct: beginners = Tuesday/Thursday 7–8 p.m.","Saturday is the advanced level.","Classes are only on certain days.","Registration is « obligatoire » (compulsory)."],"glossary":[{"fr":"un débutant","en":"a beginner"},{"fr":"obligatoire","en":"compulsory"},{"fr":"une séance","en":"a session"}]},{"id":"r-a2-04","level":"A2","kind":"message","context":"Bonjour à tous !\\nJe viens d'arriver à Québec avec ma famille. Nous cherchons une garderie pour notre fils de trois ans, près du quartier Saint-Roch. Vous avez des conseils ?\\nMerci !\\nKarim","q":"Que cherche Karim ?","options":["Un logement à Saint-Roch","Un endroit pour faire garder son enfant","Un travail à Québec","Une école pour adultes"],"a":1,"why":"Karim cherche « une garderie pour [son] fils de trois ans », c'est-à-dire un lieu où l'on s'occupe des jeunes enfants.","whyEn":"« une garderie » is a daycare: a place to look after his 3-year-old.","notes":["Saint-Roch is where he wants the daycare, not a home.","Correct: « garderie » = daycare.","Work is not mentioned.","The child is three; no adult school."],"glossary":[{"fr":"je viens d'arriver","en":"I have just arrived"},{"fr":"une garderie","en":"a daycare (Canada)"},{"fr":"un conseil","en":"a piece of advice"}]},{"id":"r-a2-05","level":"A2","kind":"notice","context":"AVIS AUX USAGERS\\nDu 3 au 7 mars, les autobus de la ligne 12 ne s'arrêteront pas à l'arrêt Laurier en raison de travaux.\\nUtilisez l'arrêt Saint-Denis, situé à 200 mètres.","q":"Que doivent faire les passagers qui descendent normalement à l'arrêt Laurier ?","options":["Prendre une autre ligne","Descendre à un arrêt voisin","Ne pas voyager pendant les travaux","Acheter un nouveau billet"],"a":1,"why":"L'avis demande d'utiliser « l'arrêt Saint-Denis, situé à 200 mètres » : un arrêt tout proche.","whyEn":"They should use the Saint-Denis stop, 200 metres away.","notes":["Line 12 still runs; only one stop is skipped.","Correct: Saint-Denis is 200 m away.","Nobody is told not to travel.","Tickets are not mentioned."],"glossary":[{"fr":"un usager","en":"a user, passenger"},{"fr":"un arrêt","en":"a stop"},{"fr":"en raison de","en":"because of"}]},{"id":"r-a2-06","level":"A2","kind":"letter","context":"Chers amis,\\nNous passons une semaine à Gaspé. Il fait frais, mais le paysage est magnifique. Hier, nous avons vu des baleines ! Demain, nous partons pour Percé.\\nGros bisous,\\nSarah et Tom","q":"Qu'ont fait Sarah et Tom hier ?","options":["Ils sont partis pour Percé","Ils ont vu des baleines","Ils sont rentrés chez eux","Ils ont nagé dans la mer"],"a":1,"why":"« Hier, nous avons vu des baleines ! » Le passé composé décrit ce qui s'est passé hier.","whyEn":"« Hier » (yesterday) + « nous avons vu des baleines » (we saw whales).","notes":["Percé is tomorrow: « Demain ».","Correct.","They are still on holiday.","Swimming is not mentioned (and it is cool: « il fait frais »)."],"glossary":[{"fr":"hier / demain","en":"yesterday / tomorrow"},{"fr":"frais","en":"cool, chilly"},{"fr":"une baleine","en":"a whale"}]},{"id":"r-a2-07","level":"A2","kind":"notice","context":"MACHINE À LAVER — MODE D'EMPLOI\\n1. Mettez le linge dans la machine.\\n2. Ajoutez la lessive.\\n3. Choisissez la température.\\n4. Insérez 2 $, puis appuyez sur « Départ ».\\nNe pas laver de chaussures.","q":"Que faut-il faire juste avant d'appuyer sur « Départ » ?","options":["Ajouter la lessive","Payer","Choisir la température","Mettre ses chaussures dans la machine"],"a":1,"why":"Étape 4 : « Insérez 2 $, puis appuyez sur Départ ». On paie juste avant de démarrer.","whyEn":"Step 4: insert $2, then press Start — paying comes right before.","notes":["Detergent is step 2, earlier.","Correct: « Insérez 2 $, puis… ».","Temperature is step 3.","Shoes are forbidden: « Ne pas laver de chaussures »."],"glossary":[{"fr":"le linge","en":"laundry"},{"fr":"la lessive","en":"detergent"},{"fr":"appuyer sur","en":"to press"}]},{"id":"r-a2-08","level":"A2","kind":"message","context":"Bonjour,\\nJe pars en vacances du 10 au 24 juillet. Pourriez-vous arroser mes plantes deux fois par semaine ? Je laisse la clé chez la concierge.\\nMerci beaucoup !\\nMme Dubois, appartement 5","q":"Que demande Mme Dubois à son voisin ?","options":["De garder sa clé pendant un an","De s'occuper de ses plantes pendant son absence","De partir en vacances avec elle","De payer la concierge"],"a":1,"why":"Elle demande : « Pourriez-vous arroser mes plantes deux fois par semaine ? » pendant ses vacances.","whyEn":"She asks the neighbour to water her plants twice a week while she is away.","notes":["The key is left with the caretaker, only for the holidays.","Correct.","She goes on holiday alone.","Nothing about paying anyone."],"glossary":[{"fr":"arroser","en":"to water"},{"fr":"deux fois par semaine","en":"twice a week"},{"fr":"la concierge","en":"the caretaker"}]},{"id":"r-b1-01","level":"B1","kind":"email","context":"Objet : Votre réclamation n° 2281\\n\\nMadame,\\n\\nNous avons bien reçu votre message concernant l'aspirateur acheté le 2 mai. Comme il est encore sous garantie, nous vous proposons de le faire réparer gratuitement dans notre atelier. Si la réparation devait prendre plus de quinze jours, nous l'échangerions contre un modèle neuf.\\n\\nLe service après-vente","q":"Dans quel cas la cliente recevra-t-elle un appareil neuf ?","options":["Si elle paie un supplément","Si la réparation dure plus de deux semaines","Si l'appareil a plus d'un an","Dans tous les cas"],"a":1,"why":"« Si la réparation devait prendre plus de quinze jours, nous l'échangerions contre un modèle neuf. » Quinze jours = deux semaines.","whyEn":"A new one only if the repair takes more than fifteen days (two weeks).","notes":["Everything is free: it is under warranty.","Correct: « plus de quinze jours ».","It was bought on 2 May and is under warranty.","The default is a free repair, not a replacement."],"glossary":[{"fr":"une réclamation","en":"a complaint"},{"fr":"sous garantie","en":"under warranty"},{"fr":"le service après-vente","en":"customer service (after-sales)"}]},{"id":"r-b1-02","level":"B1","kind":"article","context":"Depuis septembre, la ville de Sherbrooke prête gratuitement des vélos électriques à ses habitants pour une durée d'un mois. L'objectif : leur permettre d'essayer ce moyen de transport avant de l'acheter. Plus de 300 personnes se sont déjà inscrites, et la liste d'attente s'allonge.","q":"Pourquoi la ville prête-t-elle ces vélos ?","options":["Pour les vendre moins cher","Pour que les habitants puissent les tester avant un éventuel achat","Pour remplacer les autobus","Pour organiser une course"],"a":1,"why":"« L'objectif : leur permettre d'essayer ce moyen de transport avant de l'acheter. »","whyEn":"The goal is to let residents try e-bikes before buying one.","notes":["The bikes are lent free, not sold.","Correct: paraphrase of « essayer… avant de l'acheter ».","Buses are not mentioned.","No race is mentioned."],"glossary":[{"fr":"prêter","en":"to lend"},{"fr":"s'inscrire","en":"to sign up"},{"fr":"une liste d'attente","en":"a waiting list"}]},{"id":"r-b1-03","level":"B1","kind":"ad","context":"La pharmacie Lemieux recherche un(e) caissier(ère) à temps partiel (20 heures par semaine), principalement les soirs et les fins de semaine. Aucune expérience exigée : formation assurée sur place. Bonne maîtrise du français et de l'anglais requise. Envoyez votre CV avant le 15 avril.","q":"Quelle condition le candidat doit-il remplir ?","options":["Avoir déjà travaillé dans une pharmacie","Parler deux langues","Être disponible le matin","Avoir un diplôme en santé"],"a":1,"why":"« Bonne maîtrise du français et de l'anglais requise » : il faut parler les deux langues.","whyEn":"Good French and English are required.","notes":["« Aucune expérience exigée »: no experience needed.","Correct: French and English required.","The hours are mainly evenings and weekends.","No diploma is mentioned."],"glossary":[{"fr":"à temps partiel","en":"part-time"},{"fr":"exigé / requis","en":"required"},{"fr":"la maîtrise","en":"command (of a language)"}]},{"id":"r-b1-04","level":"B1","kind":"review","context":"Avis de Martin — ★★★★☆\\nNous avons loué ce chalet pour une semaine en février. Il est spacieux, bien équipé, et la vue sur le lac est superbe. Seul bémol : le chemin d'accès n'est pas déneigé le matin, il faut donc prévoir de bons pneus d'hiver. Nous y retournerons sans hésiter.","q":"Quel problème Martin signale-t-il ?","options":["Le chalet est trop petit","L'accès peut être difficile en hiver","La vue est décevante","Le chalet manque d'équipement"],"a":1,"why":"« Seul bémol » annonce le problème : le chemin n'est pas déneigé le matin.","whyEn":"« Seul bémol » = the only drawback: the access road isn't cleared of snow in the morning.","notes":["It is « spacieux » (spacious).","Correct.","The view is « superbe ».","It is « bien équipé »."],"glossary":[{"fr":"un bémol","en":"a drawback (lit. a flat note)"},{"fr":"déneigé","en":"cleared of snow"},{"fr":"sans hésiter","en":"without hesitation"}]},{"id":"r-b1-05","level":"B1","kind":"notice","context":"Chers résidents,\\nUne inspection des détecteurs de fumée aura lieu le mardi 14 novembre entre 9 h et 16 h. En votre absence, le concierge entrera dans votre logement avec son passe. Si vous ne souhaitez pas qu'il entre en votre absence, contactez la gestion avant le 10 novembre pour fixer un autre rendez-vous.\\nLa gestion","q":"Que doit faire un résident qui ne veut pas que le concierge entre en son absence ?","options":["Rester chez lui toute la journée du 14","Contacter la gestion avant une date précise","Changer la serrure","Retirer son détecteur de fumée"],"a":1,"why":"« Contactez la gestion avant le 10 novembre pour fixer un autre rendez-vous. »","whyEn":"He must contact management before 10 November to book another time.","notes":["Possible, but the notice gives another solution: a new appointment.","Correct.","Not mentioned — and not allowed.","Not mentioned."],"glossary":[{"fr":"un détecteur de fumée","en":"a smoke detector"},{"fr":"un passe","en":"a master key"},{"fr":"la gestion","en":"building management"}]},{"id":"r-b1-06","level":"B1","kind":"article","context":"Une enquête menée auprès de 1 500 nouveaux arrivants montre que la principale difficulté rencontrée la première année n'est pas la langue, mais la reconnaissance des diplômes. Près d'un répondant sur deux déclare occuper un emploi moins qualifié que dans son pays d'origine.","q":"Selon l'enquête, quel est le principal obstacle pour les nouveaux arrivants ?","options":["Apprendre la langue","Faire reconnaître leurs qualifications","Trouver un logement","S'habituer au climat"],"a":1,"why":"« La principale difficulté […] n'est pas la langue, mais la reconnaissance des diplômes. »","whyEn":"The main difficulty is getting their diplomas recognised, not the language.","notes":["Trap: the text says it is NOT the language.","Correct: « reconnaissance des diplômes ».","Housing is not mentioned.","Climate is not mentioned."],"glossary":[{"fr":"un nouvel arrivant","en":"a newcomer"},{"fr":"la reconnaissance des diplômes","en":"recognition of qualifications"},{"fr":"un répondant","en":"a respondent"}]},{"id":"r-b1-07","level":"B1","kind":"letter","context":"Salut Léa,\\nJe voulais te dire que j'ai finalement refusé le poste à Vancouver. Le salaire était intéressant, mais je ne me voyais pas partir maintenant que mon père est malade. Je resterai donc à Montréal au moins un an encore.\\nOn se voit bientôt ?\\nNico","q":"Pourquoi Nico reste-t-il à Montréal ?","options":["Le salaire proposé était trop bas","Il veut rester près de sa famille","Il n'aime pas Vancouver","Il a trouvé un meilleur poste à Montréal"],"a":1,"why":"Il ne voulait pas partir « maintenant que [son] père est malade ».","whyEn":"He didn't want to leave while his father is ill.","notes":["The salary was « intéressant » (good).","Correct.","He says nothing against Vancouver.","No other job is mentioned."],"glossary":[{"fr":"refuser un poste","en":"to turn down a job"},{"fr":"je ne me voyais pas…","en":"I couldn't see myself…"},{"fr":"malade","en":"ill"}]},{"id":"r-b1-08","level":"B1","kind":"notice","context":"PARC NATIONAL — RÈGLEMENT\\nLes chiens sont acceptés, à condition d'être tenus en laisse.\\nLes feux sont permis uniquement dans les foyers prévus à cet effet.\\nLa cueillette de plantes et de fleurs est interdite.\\nCamping : réservation obligatoire en été.","q":"Qu'est-ce qui est interdit dans le parc ?","options":["Venir avec un chien","Faire un feu dans un foyer","Cueillir des fleurs","Camper au printemps"],"a":2,"why":"« La cueillette de plantes et de fleurs est interdite. »","whyEn":"Picking plants and flowers is forbidden.","notes":["Dogs are allowed on a leash.","Fires are allowed in fire pits.","Correct.","Only summer camping needs a booking; nothing forbids spring camping."],"glossary":[{"fr":"en laisse","en":"on a leash"},{"fr":"un foyer","en":"a fire pit"},{"fr":"la cueillette","en":"picking"}]},{"id":"r-b1-09","level":"B1","kind":"article","context":"Bonne nouvelle pour les étudiants : à partir de janvier, le tarif réduit des transports en commun sera étendu aux étudiants à temps partiel. Jusqu'ici, seuls les étudiants à temps plein en bénéficiaient. Il suffira de présenter une attestation d'inscription au guichet.","q":"Qu'est-ce qui change en janvier ?","options":["Le tarif réduit sera supprimé","Davantage d'étudiants pourront payer moins cher","Les étudiants à temps plein paieront plus","Les guichets fermeront"],"a":1,"why":"Le tarif réduit « sera étendu aux étudiants à temps partiel » : plus d'étudiants en profiteront.","whyEn":"Part-time students will also get the reduced fare.","notes":["It is extended, not removed.","Correct: paraphrase of « étendu ».","Nothing changes for full-time students.","You go to the ticket office to show your certificate."],"glossary":[{"fr":"étendre","en":"to extend"},{"fr":"bénéficier de","en":"to benefit from"},{"fr":"une attestation","en":"a certificate"}]},{"id":"r-b2-01","level":"B2","kind":"opinion","context":"On présente souvent la voiture électrique comme la solution miracle à la pollution urbaine. Elle réduit certes les émissions à l'échappement. Mais elle ne règle ni les embouteillages, ni l'occupation de l'espace public par des véhicules immobiles 95 % du temps. Remplacer chaque voiture à essence par une voiture électrique, c'est changer le moteur sans changer de modèle.","q":"Quelle est la thèse de l'auteur ?","options":["La voiture électrique pollue autant qu'une voiture à essence","La voiture électrique ne résout pas tous les problèmes liés à l'automobile en ville","Il faut interdire les voitures électriques","Les voitures électriques sont trop chères"],"a":1,"why":"Après la concession (« certes »), « mais » introduit la thèse : la voiture électrique ne règle ni les embouteillages ni l'occupation de l'espace.","whyEn":"After « certes… mais », the author argues e-cars don't solve congestion or space use.","notes":["Exaggeration: he concedes it reduces exhaust emissions.","Correct.","He never asks for a ban.","Price is not discussed."],"glossary":[{"fr":"certes… mais","en":"admittedly… but"},{"fr":"l'échappement","en":"the exhaust"}]},{"id":"r-b2-02","level":"B2","kind":"article","context":"Le retour au bureau imposé par plusieurs grandes entreprises se heurte à une résistance inattendue : celle des cadres eux-mêmes. Habitués à organiser leur emploi du temps, nombre d'entre eux préfèrent changer d'employeur plutôt que de renoncer au télétravail. Pour les entreprises, le risque n'est plus seulement le mécontentement, mais la perte de compétences difficiles à remplacer.","q":"Quel risque les entreprises courent-elles ?","options":["Voir partir des employés qualifiés","Devoir agrandir leurs bureaux","Payer davantage d'impôts","Perdre des clients"],"a":0,"why":"« La perte de compétences difficiles à remplacer » : des cadres compétents quittent l'entreprise.","whyEn":"Skilled managers may leave rather than give up remote work.","notes":["Correct: paraphrase of « perte de compétences ».","Office size is not discussed.","Taxes are not mentioned.","Customers are not mentioned."],"glossary":[{"fr":"se heurter à","en":"to come up against"},{"fr":"un cadre","en":"a manager, executive"}]},{"id":"r-b2-03","level":"B2","kind":"letter","context":"Monsieur le Maire,\\n\\nRésidente du quartier Saint-Michel depuis quinze ans, je me permets de vous écrire au sujet du projet de stationnement sur le terrain de l'ancienne école. Je ne conteste pas le manque de places dans le secteur. Toutefois, ce terrain est le seul espace vert accessible aux enfants du quartier. Ne pourrait-on pas envisager un stationnement souterrain, qui préserverait le parc en surface ?\\n\\nVeuillez agréer, Monsieur le Maire, mes salutations distinguées.\\nClaire Fortin","q":"Que propose Claire Fortin ?","options":["D'abandonner tout projet de stationnement","Une solution qui concilie stationnement et espace vert","De construire une nouvelle école","De déplacer le parc dans un autre quartier"],"a":1,"why":"Elle propose « un stationnement souterrain, qui préserverait le parc en surface » : les deux besoins seraient satisfaits.","whyEn":"An underground car park keeps both the parking and the park.","notes":["She accepts the need: « Je ne conteste pas le manque de places ».","Correct.","The school is old and gone; no new school.","She wants to keep the park where it is."],"glossary":[{"fr":"je me permets de","en":"I take the liberty of"},{"fr":"souterrain","en":"underground"},{"fr":"concilier","en":"to reconcile"}]},{"id":"r-b2-04","level":"B2","kind":"article","context":"Contrairement à une idée répandue, faire la sieste n'est pas un signe de paresse. Plusieurs études montrent qu'un repos de vingt minutes en début d'après-midi améliore la concentration et réduit les erreurs. Au-delà de trente minutes, en revanche, on risque d'entrer dans un sommeil profond et de se réveiller plus fatigué qu'avant.","q":"Que conseille implicitement le texte ?","options":["Faire une sieste courte","Dormir au moins une heure l'après-midi","Éviter toute sieste","Faire la sieste le soir"],"a":0,"why":"Vingt minutes sont bénéfiques ; au-delà de trente, on se réveille plus fatigué. Le conseil implicite : une sieste courte.","whyEn":"20 minutes helps, more than 30 hurts: so, keep naps short.","notes":["Correct.","The opposite: over 30 minutes is counter-productive.","The text defends naps.","It says « en début d'après-midi »."],"glossary":[{"fr":"une idée répandue","en":"a widespread idea"},{"fr":"la paresse","en":"laziness"},{"fr":"au-delà de","en":"beyond"}]},{"id":"r-b2-05","level":"B2","kind":"review","context":"Le premier roman de Julie Gagnon raconte le retour d'une femme dans le village de son enfance, trente ans après l'avoir quitté. L'intrigue est mince et la fin se devine dès le deuxième chapitre. Pourtant, on ne lâche pas le livre : l'écriture, précise et pleine d'humour, rend chaque personnage attachant.","q":"Quel est l'avis du critique ?","options":["Le roman est mal écrit, mais l'histoire est passionnante","L'histoire est faible, mais le style compense","Le livre est ennuyeux du début à la fin","La fin est très surprenante"],"a":1,"why":"Il critique l'intrigue (« mince », fin prévisible), puis « pourtant » introduit l'éloge du style.","whyEn":"Weak plot, but « pourtant » introduces praise for the writing.","notes":["Reversed: the writing is praised, the plot criticised.","Correct.","« on ne lâche pas le livre »: it is gripping.","The ending is predictable: « se devine »."],"glossary":[{"fr":"l'intrigue","en":"the plot"},{"fr":"mince","en":"thin"},{"fr":"lâcher","en":"to put down, let go"}]},{"id":"r-b2-06","level":"B2","kind":"notice","context":"À compter du 1er janvier, les sacs d'emballage en plastique à usage unique seront interdits dans tous les commerces de la province. Les commerçants pourront fournir des sacs en papier ou réutilisables, à condition de les facturer au moins 25 cents. Les sacs servant à emballer la viande et les fruits en vrac restent temporairement autorisés.","q":"Quelle affirmation est exacte selon le texte ?","options":["Tous les sacs en plastique seront interdits, sans exception","Les sacs de remplacement ne pourront pas être gratuits","Les commerçants devront fournir des sacs gratuitement","La mesure ne s'appliquera qu'aux supermarchés"],"a":1,"why":"Les sacs en papier ou réutilisables doivent être facturés « au moins 25 cents » : ils ne peuvent pas être gratuits.","whyEn":"Replacement bags must be charged at least 25 cents.","notes":["Exception: bags for meat and loose fruit remain allowed.","Correct: paraphrase of « facturer au moins 25 cents ».","The opposite of the rule.","« tous les commerces »: all shops."],"glossary":[{"fr":"à usage unique","en":"single-use"},{"fr":"facturer","en":"to charge for"},{"fr":"en vrac","en":"loose, unpackaged"}]},{"id":"r-b2-07","level":"B2","kind":"opinion","context":"Je lis partout qu'il faut « apprendre aux enfants à coder dès le primaire ». Je suis développeur, et je n'en suis pas convaincu. Ce qui me sert chaque jour, ce n'est pas un langage de programmation — ils changent tous les cinq ans —, c'est la capacité à découper un problème, à lire attentivement et à écrire clairement. Commençons par là.","q":"Selon l'auteur, qu'est-ce qui est le plus utile aux enfants ?","options":["Apprendre un langage de programmation le plus tôt possible","Développer des compétences générales de raisonnement et d'expression","Devenir développeurs","Utiliser un ordinateur tous les jours"],"a":1,"why":"Il valorise « découper un problème, lire attentivement et écrire clairement » plutôt qu'un langage qui change.","whyEn":"General skills — problem-solving, careful reading, clear writing — matter more than a coding language.","notes":["This is the view he disagrees with.","Correct.","He never says children should become developers.","Not mentioned."],"glossary":[{"fr":"découper un problème","en":"to break a problem down"}]},{"id":"r-b2-08","level":"B2","kind":"article","context":"La pénurie de main-d'œuvre dans la restauration a eu une conséquence inattendue : plusieurs restaurants ont réduit leurs heures d'ouverture tout en augmentant les salaires. Certains constatent que leur chiffre d'affaires a peu baissé, car les clients se concentrent sur les plages horaires restantes, et que leurs employés, moins épuisés, restent plus longtemps.","q":"Quel effet positif le texte mentionne-t-il ?","options":["Les restaurants attirent beaucoup plus de clients","Le personnel est plus stable","Les prix des repas ont baissé","Les restaurants ouvrent plus tard le soir"],"a":1,"why":"Les employés, « moins épuisés, restent plus longtemps » : le personnel est plus stable.","whyEn":"Less exhausted staff stay longer — lower turnover.","notes":["Revenue « a peu baissé » — it fell slightly, no surge of customers.","Correct.","Prices are not mentioned.","They opened fewer hours."],"glossary":[{"fr":"une pénurie de main-d'œuvre","en":"a labour shortage"},{"fr":"le chiffre d'affaires","en":"revenue, turnover"},{"fr":"épuisé","en":"exhausted"}]},{"id":"r-b2-09","level":"B2","kind":"email","context":"Objet : Votre demande de congé\\n\\nBonjour Thomas,\\n\\nJ'ai bien reçu votre demande de congé sans solde pour juillet et août. Sur le principe, je n'y vois pas d'objection. Il faudra cependant que vous formiez d'ici là un collègue capable de reprendre vos dossiers clients, faute de quoi je ne pourrai pas valider votre absence.\\n\\nCordialement,\\nNathalie Bergeron, directrice","q":"À quelle condition le congé sera-t-il accepté ?","options":["Thomas doit revenir avant août","Thomas doit préparer quelqu'un pour le remplacer","Thomas doit renoncer à son salaire de juin","Aucune condition n'est fixée"],"a":1,"why":"« Il faudra […] que vous formiez un collègue […], faute de quoi je ne pourrai pas valider votre absence. »","whyEn":"He must train a colleague to take over his files; otherwise no leave.","notes":["The leave covers July and August.","Correct.","« Sans solde » concerns the leave months, not June.","« faute de quoi » sets a clear condition."],"glossary":[{"fr":"un congé sans solde","en":"unpaid leave"},{"fr":"faute de quoi","en":"failing which"}]},{"id":"r-c1-01","level":"C1","kind":"opinion","context":"Il est de bon ton de déplorer la disparition des petits commerces de centre-ville et d'en accuser les grandes surfaces de périphérie. Le reproche n'est pas infondé, mais il est incomplet. Car ce sont aussi nos propres habitudes — l'attrait du stationnement gratuit, la commodité de tout trouver au même endroit — qui ont vidé les rues commerçantes. Il serait un peu facile de pleurer ce que nous avons nous-mêmes délaissé.","q":"Que reproche implicitement l'auteur à ses lecteurs ?","options":["De ne pas fréquenter les grandes surfaces","D'avoir contribué au déclin qu'ils regrettent","D'exiger des stationnements payants","D'ignorer l'existence des petits commerces"],"a":1,"why":"« Il serait un peu facile de pleurer ce que nous avons nous-mêmes délaissé » : nos habitudes ont causé ce déclin.","whyEn":"We mourn small shops we ourselves abandoned.","notes":["The opposite: we go there too much.","Correct.","We like free parking.","We know them; we just stopped going."]},{"id":"r-c1-02","level":"C1","kind":"opinion","context":"La multiplication des certifications « durables » sur les emballages devait éclairer le consommateur. Elle l'a surtout désorienté. Faute de savoir distinguer un label exigeant d'un simple argument publicitaire, beaucoup ont fini par n'en croire aucun — ce qui pénalise précisément les producteurs qui avaient fait l'effort de respecter un cahier des charges contraignant.","q":"Quelle conséquence paradoxale l'auteur souligne-t-il ?","options":["Les labels ont fait augmenter les ventes de tous les produits","La méfiance générale nuit aux producteurs les plus sérieux","Les consommateurs réclament davantage de labels","Les producteurs ont abandonné les labels"],"a":1,"why":"Les consommateurs ne croient plus aucun label, ce qui « pénalise précisément » les producteurs exigeants.","whyEn":"General distrust hurts exactly the producers who made the effort.","notes":["Not stated.","Correct.","They believe none of them.","Not stated."]},{"id":"r-c1-03","level":"C1","kind":"literary","context":"Il y avait dans la maison de ma grand-mère une pièce où personne n'entrait. On n'en parlait pas, on ne l'interdisait pas non plus : on passait devant, simplement, comme on passe devant une tombe dont on a oublié le nom. Ce n'est qu'à sa mort que j'ai poussé la porte, et compris que ce silence-là avait été, toute sa vie, sa manière de pleurer.","q":"Que révèle la dernière phrase ?","options":["La grand-mère cachait un trésor dans cette pièce","Le silence autour de la pièce exprimait un deuil","Le narrateur avait peur de sa grand-mère","La pièce servait de cimetière familial"],"a":1,"why":"Le silence était « sa manière de pleurer » : la pièce est liée à une perte jamais exprimée.","whyEn":"The silence was her way of grieving.","notes":["Nothing suggests a treasure.","Correct.","Not suggested.","« comme une tombe » is a comparison, not a fact."]},{"id":"r-c1-04","level":"C1","kind":"opinion","context":"Les défenseurs de la semaine de quatre jours invoquent volontiers les expériences réussies à l'étranger. Encore faudrait-il préciser que la plupart concernent des entreprises de services, aux tâches largement numérisées, et volontaires pour l'expérience. En tirer des conclusions pour un hôpital ou une usine relève moins de l'analyse que du vœu pieux.","q":"Que reproche l'auteur aux défenseurs de la semaine de quatre jours ?","options":["D'ignorer les expériences étrangères","De généraliser à partir de cas peu représentatifs","De vouloir l'imposer aux seules entreprises de services","De refuser toute expérimentation"],"a":1,"why":"Les exemples cités concernent des entreprises particulières et volontaires ; les appliquer à un hôpital est un « vœu pieux ».","whyEn":"They generalise from unrepresentative, volunteer service companies.","notes":["They cite them a lot.","Correct.","The opposite: they extend it to all sectors.","They rely on experiments."]},{"id":"r-c1-05","level":"C1","kind":"opinion","context":"Que la ville veuille végétaliser ses toits, on ne peut que s'en réjouir. On aimerait toutefois que l'enthousiasme municipal s'accompagne d'un minimum de suivi : sur les quarante toitures aménagées il y a cinq ans, la moitié sont aujourd'hui à l'abandon, faute d'entretien. Planter est photogénique ; arroser l'est beaucoup moins.","q":"Quel est le ton de la dernière phrase ?","options":["Admiratif","Ironique","Neutre","Enthousiaste"],"a":1,"why":"L'auteur oppose ce qui se voit (planter) et ce qui ne se voit pas (arroser) pour se moquer d'une politique d'image : le ton est ironique.","whyEn":"Mocking a policy driven by photo opportunities rather than maintenance.","notes":["He criticises.","Correct.","There is a clear judgement.","The enthusiasm he mentions is the city's, not his."]},{"id":"r-c1-06","level":"C1","kind":"opinion","context":"Sous couvert de « flexibilité », le nouveau contrat supprime la majoration des heures travaillées le dimanche. La direction affirme que rien ne change pour les salariés qui ne travaillent pas ce jour-là — ce qui est exact, et parfaitement hors sujet, puisque ce sont précisément ceux qui travaillent le dimanche qui y perdent.","q":"Que pense l'auteur de l'argument de la direction ?","options":["Il est faux","Il est exact, mais il ne répond pas au problème","Il est convaincant","Il concerne tous les salariés"],"a":1,"why":"« Ce qui est exact, et parfaitement hors sujet » : vrai, mais sans rapport avec les salariés concernés.","whyEn":"True but irrelevant: the people affected are those who work Sundays.","notes":["He says it is « exact ».","Correct.","He rejects it as irrelevant.","It concerns only non-Sunday workers."]},{"id":"r-c2-01","level":"C2","kind":"opinion","context":"On a beaucoup glosé sur la mort du livre, annoncée à chaque génération avec une régularité qui finit par rassurer. À croire que le livre est de ces moribonds qui enterrent leurs médecins. Ce qui menace la lecture n'est peut-être pas tant la concurrence des écrans que l'érosion du temps long, ce luxe devenu discret dont le livre n'était que le symptôme le plus visible.","q":"Selon l'auteur, qu'est-ce qui menace réellement la lecture ?","options":["La disparition des librairies","La raréfaction du temps disponible pour une attention prolongée","Les écrans en tant que tels","Le prix des livres"],"a":1,"why":"« Pas tant la concurrence des écrans que l'érosion du temps long » : c'est le temps d'attention prolongée qui disparaît.","whyEn":"Not screens as such, but the loss of long, uninterrupted time.","notes":["Not mentioned.","Correct.","« pas tant… que » downplays the screens.","Not mentioned."]},{"id":"r-c2-02","level":"C2","kind":"opinion","context":"Il serait injuste de reprocher à ce rapport sa prudence : la matière s'y prête mal aux certitudes. On peut en revanche s'étonner qu'à force de ne rien exclure, il finisse par ne rien recommander. Une prudence qui ne débouche sur aucune préconisation cesse d'être une vertu pour devenir une manière élégante de s'abstenir.","q":"Que reproche l'auteur au rapport ?","options":["D'être trop catégorique","De ne formuler aucune recommandation concrète","D'avoir été rédigé trop vite","De contenir des erreurs factuelles"],"a":1,"why":"« À force de ne rien exclure, il finit par ne rien recommander » : la prudence devient une façon de s'abstenir.","whyEn":"By ruling nothing out, it recommends nothing.","notes":["The opposite.","Correct.","Not mentioned.","Not mentioned."]},{"id":"r-c2-03","level":"C2","kind":"literary","context":"Il parlait de son village natal avec cette tendresse un peu contrite qu'on réserve aux êtres qu'on a quittés sans se retourner. Chaque été, il promettait d'y retourner ; chaque été, quelque urgence venait opportunément l'en dispenser. Au fond, il n'aimait ce lieu qu'à la condition de ne plus y être.","q":"Que suggère la dernière phrase sur le personnage ?","options":["Il déteste son village","Son attachement au village suppose qu'il en reste éloigné","Il retourne chaque été au village","Il a été chassé de son village"],"a":1,"why":"« Il n'aimait ce lieu qu'à la condition de ne plus y être » : son affection dépend de la distance.","whyEn":"He loves the place only from afar.","notes":["He speaks of it with tenderness.","Correct.","Each summer an « urgence » excuses him.","He left « sans se retourner »: by choice."]},{"id":"r-c2-04","level":"C2","kind":"opinion","context":"Le débat sur l'intelligence artificielle souffre d'un étrange paradoxe : ceux qui en promettent monts et merveilles et ceux qui en annoncent l'apocalypse partagent au fond la même conviction, celle de sa toute-puissance. Entre l'émerveillement et l'effroi, il reste pourtant une place, moins spectaculaire, pour l'examen patient de ce que ces outils font réellement, et de ce qu'ils ne font pas.","q":"Quel point commun l'auteur relève-t-il entre les deux camps ?","options":["Ils refusent d'utiliser l'intelligence artificielle","Ils surestiment tous deux la puissance de cette technologie","Ils réclament une réglementation stricte","Ils ignorent les risques"],"a":1,"why":"Les deux camps partagent « la même conviction, celle de sa toute-puissance ».","whyEn":"Both believe AI is all-powerful.","notes":["Not stated.","Correct.","Not stated.","The pessimists focus on risks."]},{"id":"r-c2-05","level":"C2","kind":"opinion","context":"Nul ne conteste que la traduction automatique ait fait des progrès considérables. Mais à mesure qu'elle devient plus fluide, ses erreurs deviennent plus insidieuses : un contresens grossier se repère au premier coup d'œil, une phrase élégante et fausse passe inaperçue. La qualité apparente, loin de dispenser de la vigilance, la rend plus nécessaire que jamais.","q":"Quelle idée l'auteur défend-il ?","options":["Les traductions automatiques sont désormais fiables","La fluidité des traductions rend leurs erreurs plus difficiles à repérer","Il faut interdire la traduction automatique","Les erreurs grossières sont les plus dangereuses"],"a":1,"why":"Une phrase « élégante et fausse passe inaperçue » : plus la traduction est fluide, plus ses erreurs sont cachées.","whyEn":"The more fluent the output, the harder its mistakes are to spot.","notes":["He concedes progress, not reliability.","Correct.","Not stated.","The opposite: obvious errors are easy to spot."]},{"id":"r-c2-06","level":"C2","kind":"opinion","context":"On loue volontiers l'entrepreneur « qui a pris des risques ». Encore faudrait-il distinguer celui qui risque son propre patrimoine de celui qui fait porter l'aléa à d'autres — salariés, créanciers, contribuables — tout en se réservant les gains en cas de succès. Le second n'est pas audacieux ; il est seulement bien placé.","q":"Que signifie « il est seulement bien placé » ?","options":["Il a eu la chance d'être au bon endroit","Sa position lui permet de garder les gains sans assumer les pertes","Il occupe un poste élevé dans l'entreprise","Il est plus courageux que les autres"],"a":1,"why":"Il fait « porter l'aléa à d'autres » tout en se réservant les gains : sa position le protège, ce n'est pas du courage.","whyEn":"His position lets others bear the risk while he keeps the gains.","notes":["Too literal: this is about risk-shifting, not luck.","Correct.","Too literal a reading of « placé ».","The opposite: « n'est pas audacieux »."]}]`),g=JSON.parse(`[{"id":"ee1","n":1,"title":"Tâche 1 — Message personnel","minutes":15,"min":60,"max":120,"audience":"Un ou plusieurs destinataires précisés dans la consigne. Registre adapté.","goal":"Décrire, raconter ou expliquer — dans un message simple mais structuré.","official":"rédaction d'un message pour décrire, raconter et/ou expliquer, adressé à un ou plusieurs destinataires dont le statut est précisé dans la consigne.","plan":["Salutation adaptée au destinataire","La nouvelle ou la raison du message, dès la première phrase","2 ou 3 détails concrets, pas une liste","Ce que vous attendez du destinataire : invitation, question, proposition","Formule de clôture"],"connectors":["Ça y est,","d'abord","ensuite","en revanche","par contre","du coup","en tout cas","À très vite,"],"checklist":[{"id":"c1","text":"J'ai respecté la longueur demandée (60 à 120 mots) — comptée, pas estimée."},{"id":"c2","text":"J'ai traité TOUS les points de la consigne, sans en oublier un."},{"id":"c3","text":"J'ai utilisé un registre adapté au destinataire (tu ou vous, sans mélange) et une formule d'ouverture et de clôture."},{"id":"c4","text":"J'ai relu en cherchant uniquement les accords (sujet-verbe, adjectifs) — ma faute la plus fréquente."},{"id":"c5","text":"J'ai vérifié les temps du passé : passé composé pour les événements, imparfait pour les descriptions."}],"prompts":[{"id":"ee1","prompt":"Vous venez d'emménager dans une nouvelle ville. Vous écrivez à un(e) ami(e)\\nfrancophone pour lui décrire votre nouveau quartier, lui dire ce que vous aimez et ce qui\\nvous manque, puis l'inviter à venir vous rendre visite.","model":"Salut Camille,\\n\\nÇa y est, j'ai emménagé ! Je suis installée à Lyon depuis samedi dernier et je commence\\nenfin à me repérer.\\n\\nLe quartier me plaît beaucoup : il y a un marché le mercredi, une boulangerie au coin de\\nla rue et un grand parc à cinq minutes à pied. En revanche, c'est assez bruyant le soir,\\net mes anciens voisins me manquent un peu.\\n\\nEst-ce que tu voudrais venir passer un week-end ici ? Je peux te loger sans problème et je\\nte ferai visiter la vieille ville. Dis-moi quelles dates t'arrangent en septembre.\\n\\nÀ très vite,\\nLéa","promptEn":"You have just moved to a new city. Write to a French-speaking friend: describe your neighbourhood, say what you like and what you miss, and invite them to visit."},{"id":"ee1-b","prompt":"Un ami vous a invité(e) à son anniversaire samedi soir, mais vous ne pouvez pas y\\naller. Écrivez-lui un message pour vous excuser, expliquer pourquoi vous serez absent(e) et\\nlui proposer de vous voir un autre jour.","model":"Salut Karim,\\n\\nMerci beaucoup pour ton invitation ! Malheureusement, je ne pourrai pas venir à ton\\nanniversaire samedi soir, et j'en suis vraiment désolé.\\n\\nMa sœur déménage ce week-end à Bordeaux et je lui ai promis de l'aider il y a déjà un\\nmois. Nous partons vendredi avec le camion et nous ne rentrerons que dimanche soir.\\n\\nPour me faire pardonner, je t'invite au restaurant la semaine prochaine. Est-ce que tu es\\nlibre mercredi ou jeudi soir ? Je connais un endroit qui va te plaire.\\n\\nPasse une excellente soirée, et bon anniversaire en avance !\\n\\nThomas","promptEn":"A friend invited you to their birthday on Saturday evening but you can't go. Apologise, explain why, and suggest meeting another day."},{"id":"ee1-c","prompt":"Vous cherchez un(e) colocataire pour partager votre appartement. Rédigez une annonce\\npour un site Internet : décrivez l'appartement et le quartier, indiquez le loyer, et précisez\\nle type de personne que vous recherchez.","model":"Colocation — chambre libre à partir du 1er octobre\\n\\nBonjour,\\n\\nJe cherche un ou une colocataire pour partager un appartement de 70 m² au troisième étage,\\nprès de la gare de Nantes. La chambre, lumineuse et meublée, donne sur une cour calme. Nous\\npartagerons le salon, la cuisine équipée et la salle de bains.\\n\\nLe quartier est très pratique : tramway à deux minutes, supermarché et marché le samedi.\\n\\nLe loyer est de 450 euros par mois, charges et Internet compris.\\n\\nJe travaille à l'hôpital, avec des horaires décalés : je recherche donc une personne\\ncalme, non-fumeuse et respectueuse. Les étudiants sont les bienvenus.\\n\\nContactez-moi par courriel pour visiter.\\n\\nJulie","promptEn":"You are looking for a flatmate. Write an online ad: describe the flat and the area, give the rent, and say what kind of person you are looking for."},{"id":"ee1-d","prompt":"Vous venez de commencer un nouveau travail. Vous écrivez un courriel à un(e) ami(e) pour lui raconter votre première semaine : vos collègues, vos tâches, ce qui vous plaît et ce qui est difficile.","promptEn":"You've just started a new job. Email a friend about your first week: colleagues, tasks, what you like and what is hard.","model":"Salut Clara,\\n\\nÇa y est, j'ai terminé ma première semaine à la bibliothèque municipale ! Mes collègues sont très sympathiques : le premier jour, ils m'ont fait visiter tous les services et m'ont invitée à déjeuner.\\n\\nJe m'occupe surtout de l'accueil du public et des inscriptions. Ce qui me plaît le plus, c'est de conseiller des livres aux enfants. En revanche, l'ordinateur de prêt est compliqué et je fais encore beaucoup d'erreurs. Heureusement, tout le monde est patient avec moi.\\n\\nEt toi, comment vas-tu ? On se voit samedi pour en parler ?\\n\\nBises,\\nAmina"},{"id":"ee1-e","prompt":"Votre collègue Pierre part à la retraite le mois prochain. Vous écrivez un message à toute l'équipe pour organiser une fête de départ : date, lieu, programme. Vous proposez aussi de participer à un cadeau.","promptEn":"Your colleague Pierre is retiring next month. Write to the whole team to organise a farewell party (date, place, plan) and suggest chipping in for a gift.","model":"Bonjour à tous,\\n\\nComme vous le savez, Pierre part à la retraite le 30 juin, après vingt-cinq ans dans notre entreprise. Je vous propose de lui organiser une petite fête de départ le vendredi 27 juin, à partir de 17 h, dans la salle de réunion du deuxième étage.\\n\\nAu programme : un discours de la directrice, un buffet et, bien sûr, un cadeau. Pierre adore la randonnée : nous pourrions lui offrir un bon sac à dos. Si vous souhaitez participer, déposez votre contribution dans l'enveloppe qui se trouve sur mon bureau avant le 20 juin.\\n\\nMerci et à bientôt,\\nSophie"}],"phrases":[{"fr":"Salut [prénom], / Bonjour [prénom],","en":"Hi [name], — informal opening (tu)"},{"fr":"Madame, Monsieur,","en":"Dear Sir or Madam, — formal opening (vous)"},{"fr":"Je t'écris pour te dire que…","en":"I'm writing to tell you that…"},{"fr":"Ça y est, j'ai…","en":"That's it, I've (finally)…"},{"fr":"Ce qui me plaît le plus, c'est…","en":"What I like most is…"},{"fr":"En revanche, … me manque.","en":"On the other hand, I miss…"},{"fr":"Malheureusement, je ne pourrai pas…","en":"Unfortunately, I won't be able to…"},{"fr":"Est-ce que tu serais libre… ?","en":"Would you be free…?"},{"fr":"Je te propose de…","en":"I suggest that we…"},{"fr":"Dis-moi ce qui t'arrange.","en":"Let me know what suits you."},{"fr":"À très vite, / Bises, / Je t'embrasse,","en":"See you soon / Love — informal closings"},{"fr":"Cordialement,","en":"Kind regards — neutral/formal closing"}],"titleEn":"Task 1 — Personal message (60–120 words)","goalEn":"Describe, tell or explain in a short, well-organised message to the person named in the prompt."},{"id":"ee2","n":2,"title":"Tâche 2 — Récit d'expérience et opinion","minutes":20,"min":120,"max":150,"audience":"Plusieurs destinataires (lecteurs d'un blog, d'un forum, d'un journal). Registre courant à soutenu.","goal":"Raconter une expérience ET la commenter : un récit accompagné d'un avis argumenté.","official":"rédaction d'un article, d'un courrier ou d'une note à l'intention de plusieurs destinataires, pour faire un compte rendu d'expérience ou un récit, accompagné de commentaires, d'opinions ou d'arguments.","plan":["Une phrase d'accroche qui situe l'expérience (quand, où, avec qui)","Le récit : 3 ou 4 faits au passé, dans l'ordre","Votre avis sur cette expérience, clairement annoncé","Un ou deux arguments, dont une nuance (« certes… mais… »)","Une phrase de conclusion : conseil, recommandation ou souhait"],"connectors":["L'année dernière,","tout d'abord","ensuite","finalement","à mon avis","certes","cependant","c'est pourquoi"],"checklist":[{"id":"c1","text":"J'ai respecté la longueur (120 à 150 mots)."},{"id":"c2","text":"Mon texte contient un RÉCIT au passé (ce qui s'est passé) et pas seulement des idées générales."},{"id":"c3","text":"Mon opinion est explicite et justifiée par au moins un argument."},{"id":"c4","text":"J'ai utilisé au moins trois connecteurs logiques différents et corrects."},{"id":"c5","text":"J'ai construit des paragraphes séparés (pas un bloc unique)."},{"id":"c6","text":"J'ai employé au moins une structure de niveau B2 (subjonctif après « bien que », concession « certes… mais »)."}],"prompts":[{"id":"ee2","prompt":"Le site d'un magazine francophone consacre un dossier au téléphone portable à l'école\\net invite ses lecteurs à témoigner. Vous rédigez un message pour le forum : vous racontez une\\nexpérience vécue (comme élève, parent ou enseignant), puis vous dites si, selon vous, il faut\\ninterdire le téléphone dans les établissements scolaires.","model":"L'année dernière, le collège de ma fille a décidé d'interdire les téléphones portables\\npendant toute la journée. Au début, les élèves ont protesté et ma fille est rentrée furieuse\\nà la maison. Pourtant, après quelques semaines, elle m'a raconté que tout le monde jouait de\\nnouveau aux cartes pendant les pauses et que les disputes sur les réseaux sociaux avaient\\npresque disparu.\\n\\nCette expérience m'a convaincue. À mon avis, l'interdiction pendant les cours est justifiée,\\ncar une seule notification suffit à déconcentrer une classe entière.\\n\\nCertes, le téléphone peut être un outil pédagogique utile. Cependant, rien n'empêche un\\nprofesseur de l'autoriser ponctuellement pour une activité précise.\\n\\nC'est pourquoi je suis favorable à une règle simple : le téléph
