one reste dans le sac, sauf\\nsi l'enseignant demande de le sortir.","promptEn":"A magazine asks readers about mobile phones at school. Tell an experience you had (as a pupil, parent or teacher), then say whether phones should be banned in schools."},{"id":"ee2-b","prompt":"Vous avez participé pour la première fois à une action bénévole (aide alimentaire,\\nnettoyage d'une plage, soutien scolaire…). Vous écrivez un article pour le journal interne de\\nvotre entreprise : racontez cette expérience et expliquez pourquoi vos collègues devraient,\\nselon vous, essayer à leur tour.","model":"Samedi dernier, j'ai participé pour la première fois à une collecte alimentaire dans un\\nsupermarché de mon quartier. Avec cinq autres bénévoles, nous avons distribué des sacs à\\nl'entrée du magasin, puis trié les dons toute l'après-midi. En quelques heures, nous avons\\nrempli quarante cartons de pâtes, de conserves et de produits pour bébés.\\n\\nJ'avoue que j'hésitais à y aller : je pensais ne pas avoir le temps. Pourtant, cette journée\\nm'a apporté bien plus que je ne l'imaginais. J'ai rencontré des gens chaleureux et j'ai\\ncompris que beaucoup de familles de notre ville ont réellement besoin d'aide.\\n\\nCertes, donner un samedi demande un effort. Mais on rentre chez soi avec le sentiment\\nd'avoir été utile, ce qui est rare. C'est pourquoi je vous encourage à essayer : la prochaine\\ncollecte aura lieu en décembre.","promptEn":"You volunteered for the first time. Write an article for your company newsletter: tell the experience and explain why colleagues should try it."},{"id":"ee2-c","prompt":"Vous avez suivi pendant trois mois des cours de français en ligne. Sur un forum\\nd'apprenants, vous racontez comment cela s'est passé et vous dites si vous recommandez cette\\nfaçon d'apprendre.","model":"Je voudrais partager mon expérience avec ceux qui hésitent à s'inscrire à des cours en\\nligne. En janvier, j'ai commencé une formation de français à distance : deux séances par\\nsemaine, le soir, avec une professeure et six autres étudiants.\\n\\nLes premières semaines ont été difficiles. Je n'osais pas parler devant la caméra et la\\nconnexion coupait souvent. Peu à peu, j'ai pris l'habitude, et j'ai surtout apprécié de\\npouvoir suivre les cours depuis chez moi, après le travail.\\n\\nÀ mon avis, cette méthode convient très bien aux personnes organisées. En effet, personne\\nne vous oblige à faire les exercices : il faut de la discipline. En revanche, bien que les\\néchanges soient agréables, on parle moins qu'en classe.\\n\\nJe la recommande donc, à condition de pratiquer aussi le français avec de vraies personnes.","promptEn":"You took online French classes for three months. On a learners' forum, tell how it went and say whether you recommend learning this way."},{"id":"ee2-d","prompt":"Une association d'aide aux nouveaux arrivants publie sur son blog des témoignages. Vous racontez vos premières semaines dans votre nouvelle ville ou votre nouveau pays, puis vous donnez votre avis : qu'est-ce qui aide le plus à bien s'installer ?","promptEn":"A newcomers' association collects stories for its blog. Tell your first weeks in your new city or country, then say what helps most to settle in.","model":"Je suis arrivé à Montréal en janvier, en plein hiver, avec deux valises et beaucoup d'inquiétude. Les premiers jours ont été difficiles : il faisait moins vingt, je ne connaissais personne et je ne comprenais pas l'accent québécois. J'ai passé des heures à remplir des formulaires pour ma carte d'assurance maladie et mon compte bancaire.\\n\\nTout a changé quand je me suis inscrit à des cours de français dans un centre communautaire. J'y ai rencontré d'autres nouveaux arrivants et une bénévole qui m'a aidé à rédiger mon CV.\\n\\nÀ mon avis, ce qui aide le plus, ce n'est pas l'argent, mais les contacts humains. Certes, il faut être patient avec l'administration, mais un réseau d'amis rend tout plus simple. C'est pourquoi je conseille à chaque nouvel arrivant de s'inscrire très vite à une activité de groupe."},{"id":"ee2-e","prompt":"Vous avez assisté récemment à un événement dans votre ville (festival, concert, match, spectacle). Vous écrivez un article pour le journal de votre quartier : vous racontez la soirée et vous dites si vous recommandez cet événement.","promptEn":"You recently attended an event in your city. Write an article for your local paper: tell the evening and say whether you recommend it.","model":"Samedi dernier, je suis allée pour la première fois au festival de jazz du parc Lafontaine. Nous sommes arrivés vers dix-neuf heures : la foule était déjà nombreuse, mais l'ambiance était calme et familiale. Trois groupes se sont succédé sur la grande scène, et le dernier, une chanteuse haïtienne, a fait danser tout le public jusqu'à minuit.\\n\\nJ'ai particulièrement apprécié la gratuité des concerts et la présence de nombreux camions de cuisine du monde. En revanche, les files d'attente pour les toilettes étaient interminables.\\n\\nMalgré ce petit défaut, je recommande vivement ce festival. Bien qu'il soit très fréquenté, il reste un moment de partage rare, où toutes les générations se retrouvent autour de la musique. N'oubliez pas votre chaise pliante !"}],"phrases":[{"fr":"L'année dernière, j'ai eu l'occasion de…","en":"Last year, I had the opportunity to…"},{"fr":"Je voudrais partager mon expérience de…","en":"I'd like to share my experience of…"},{"fr":"Au début, j'étais un peu inquiet(ète), mais…","en":"At first I was a bit worried, but…"},{"fr":"Ce qui m'a le plus marqué, c'est…","en":"What struck me most was…"},{"fr":"Peu à peu, j'ai compris que…","en":"Little by little, I realised that…"},{"fr":"À mon avis, … parce que…","en":"In my opinion, … because…"},{"fr":"Je trouve que c'est une expérience enrichissante.","en":"I find it a rewarding experience."},{"fr":"Certes, …, mais…","en":"Admittedly, …, but…"},{"fr":"Bien que ce soit difficile, …","en":"Although it is difficult, … (+ subjunctive)"},{"fr":"Je recommande cette expérience à tous ceux qui…","en":"I recommend it to anyone who…"},{"fr":"Si c'était à refaire, je…","en":"If I had to do it again, I would…"}],"titleEn":"Task 2 — Account of an experience + opinion (120–150 words)","goalEn":"Tell what happened (past tenses) AND say what you think about it, for several readers."},{"id":"ee3","n":3,"title":"Tâche 3 — Comparer deux points de vue et prendre position","minutes":25,"min":120,"max":180,"audience":"Public large (journal, site Internet, collègues). Registre soutenu, ton objectif puis personnel.","goal":"Restituer objectivement deux positions opposées, PUIS prendre parti. Les deux mouvements doivent être visibles.","official":"rédaction d'un texte qui compare deux points de vue portant sur un fait de société, exprimés dans deux documents courts, puis prise de position. Les sujets d'exemple officiels répartissent le texte en deux parties : présenter les deux opinions avec vos propres mots (environ 40 à 60 mots), puis donner la vôtre (environ 80 à 120 mots).","plan":["Partie 1 (≈ 40–60 mots) : poser le sujet en une phrase neutre","Rendre compte du document 1, puis du document 2, en marquant l'opposition — reformuler, ne pas recopier","Partie 2 (≈ 80–120 mots) : transition explicite vers votre avis (« Pour ma part… »)","Votre position + un argument + un exemple","Une nuance ou une proposition pour conclure"],"connectors":["Selon le premier auteur,","à l'inverse","quant à","tandis que","Pour ma part,","il n'en reste pas moins que","en revanche","c'est pourquoi"],"checklist":[{"id":"c1","text":"J'ai respecté la longueur (120 à 180 mots)."},{"id":"c2","text":"J'ai rendu compte des DEUX documents avant de donner mon avis."},{"id":"c3","text":"J'ai reformulé les documents au lieu de recopier des phrases entières."},{"id":"c4","text":"La transition vers mon opinion est explicite (« Pour ma part », « Quant à moi »)."},{"id":"c5","text":"J'ai justifié ma position par un argument ou un exemple, pas seulement affirmé."},{"id":"c6","text":"J'ai employé des marqueurs d'opposition variés (à l'inverse, tandis que, en revanche)."},{"id":"c7","text":"J'ai relu une dernière fois uniquement pour la ponctuation et les majuscules."}],"prompts":[{"id":"ee3","prompt":"Vous lisez ces deux avis publiés sur un site d'actualité locale.\\n\\nDOCUMENT 1 — Sophie, 34 ans, usagère :\\n« La gratuité des transports en commun devrait être la règle. Dans les villes qui l'ont\\nadoptée, la fréquentation a bondi et les habitants les plus modestes ont retrouvé une\\nvéritable liberté de déplacement. C'est aussi le moyen le plus simple de réduire le trafic\\nautomobile et la pollution en centre-ville. »\\n\\nDOCUMENT 2 — Marc, économiste :\\n« La gratuité n'est jamais gratuite : quelqu'un paie, et c'est le contribuable. L'argent\\nqui manque, ce sont les nouvelles lignes et les rames supplémentaires qu'on ne construira\\npas. Un réseau ponctuel et fréquent attire davantage d'automobilistes qu'un réseau gratuit\\nmais saturé. »\\n\\nRédigez un texte dans lequel vous présentez les deux points de vue avec vos propres mots,\\npuis vous donnez le vôtre en le justifiant.","model":"La gratuité des transports en commun divise. Pour Sophie, c'est une mesure à la fois\\nsociale et écologique, qui rend leur mobilité aux ménages modestes et réduit la circulation\\nautomobile. À l'inverse, Marc rappelle qu'elle est financée par l'impôt, au détriment du\\ndéveloppement du réseau, alors que la qualité du service compte davantage que son prix.\\n\\nPour ma part, l'argument économique me paraît le plus solide. J'ai longtemps habité une\\nville où le bus était bon marché mais ne passait que toutes les quarante minutes : personne\\nne le prenait, et tout le monde gardait sa voiture. Ce qui décide les gens, c'est de pouvoir\\ncompter sur un transport rapide et régulier.\\n\\nIl n'en reste pas moins que la question sociale soulevée par Sophie est réelle. C'est\\npourquoi je défendrais plutôt des tarifs très réduits pour les revenus modestes, afin que\\nl'argent des autres voyageurs continue de financer un réseau dense et fiable.","promptEn":"Two opinions on free public transport. Present both in your own words, then give and justify your own view."},{"id":"ee3-b","prompt":"Vous lisez ces deux témoignages dans le courrier des lecteurs d'un magazine.\\n\\nDOCUMENT 1 — Inès, graphiste :\\n« Depuis que je travaille de chez moi, je gagne deux heures par jour : plus de trajets, plus\\nde bruit de bureau. Je suis plus concentrée, je déjeune avec mes enfants et je n'ai jamais\\nété aussi efficace. Je ne retournerais pour rien au monde dans un bureau cinq jours par\\nsemaine. »\\n\\nDOCUMENT 2 — Paul, chef d'équipe :\\n« Le télétravail a abîmé notre équipe. Les nouveaux n'apprennent plus le métier en\\nobservant leurs collègues, les idées ne circulent plus à la machine à café et certains\\nse sentent très seuls. Un écran ne remplacera jamais une vraie discussion. »\\n\\nRédigez un texte dans lequel vous présentez les deux points de vue avec vos propres mots,\\npuis vous donnez le vôtre en le justifiant.","model":"Le télétravail ne fait pas l'unanimité. Inès y voit un gain de temps et de concentration\\nqui lui permet de mieux concilier sa vie professionnelle et sa vie de famille. Paul, au\\ncontraire, estime qu'il affaiblit les équipes : les débutants se forment moins bien, les\\néchanges informels disparaissent et certains salariés souffrent d'isolement.\\n\\nQuant à moi, je pense que les deux ont raison, parce qu'ils ne parlent pas de la même\\nchose. Inès décrit un travail individuel, qui demande du calme, tandis que Paul pense à\\nla vie collective de l'entreprise. Dans mon ancien emploi, nous travaillions à distance\\ntrois jours par semaine : les tâches avançaient vite, mais il fallait des mois pour\\nconnaître un nouveau collègue.\\n\\nC'est pourquoi une organisation mixte me semble la meilleure solution. Bien que le bureau\\nsoit parfois bruyant, deux jours de présence commune suffisent pour former les nouveaux\\net garder un esprit d'équipe.","promptEn":"Two opinions on working from home. Present both in your own words, then give and justify your own view."},{"id":"ee3-c","prompt":"Vous lisez ces deux opinions sur le forum d'une association de parents d'élèves.\\n\\nDOCUMENT 1 — Mme Laurent, enseignante :\\n« Les tablettes en classe motivent les élèves. Avec elles, chacun avance à son rythme, les\\nexercices sont corrigés immédiatement et les enfants en difficulté osent enfin se tromper.\\nRefuser le numérique à l'école, c'est préparer les enfants à un monde qui n'existe plus. »\\n\\nDOCUMENT 2 — M. Benali, pédiatre :\\n« Les enfants passent déjà trop d'heures devant les écrans à la maison. L'école devrait\\nêtre l'endroit où l'on apprend à écrire à la main, à se concentrer longtemps et à parler\\navec les autres. Aucune étude sérieuse ne montre que les tablettes améliorent les résultats\\nscolaires. »\\n\\nRédigez un texte dans lequel vous présentez les deux points de vue avec vos propres mots,\\npuis vous donnez le vôtre en le justifiant.","model":"La place des tablettes à l'école primaire fait débat. Selon Mme Laurent, elles motivent\\nles élèves, s'adaptent au rythme de chacun et préparent les enfants au monde d'aujourd'hui.\\nM. Benali juge au contraire que l'école doit protéger les enfants des écrans, déjà trop\\nprésents à la maison, et il doute de leur efficacité pédagogique.\\n\\nPour ma part, je partage plutôt l'inquiétude du pédiatre. Mon neveu de huit ans utilise\\nune tablette en classe depuis un an : il adore les exercices, mais il écrit de plus en\\nplus mal et il se décourage dès qu'un texte est un peu long. Apprendre à se concentrer\\nsans stimulation permanente me paraît essentiel à cet âge.\\n\\nIl n'en reste pas moins que le numérique fait partie de la vie des enfants. Je serais donc\\nfavorable à un usage limité, une ou deux heures par semaine, à condition que le reste du\\ntemps soit consacré aux livres, à l'écriture et à la discussion.","promptEn":"Two opinions on tablets in primary schools. Present both in your own words, then give and justify your own view."},{"id":"ee3-d","prompt":"Vous lisez ces deux opinions sur le site du journal de votre ville.\\n\\nDOCUMENT 1 — Luc, commerçant :\\n« Fermer le centre-ville aux voitures, c'est condamner nos commerces. Mes clients viennent des quartiers voisins et de la banlieue ; sans stationnement, ils iront au centre commercial. Les familles avec des enfants et les personnes âgées ne peuvent pas tout porter à pied. »\\n\\nDOCUMENT 2 — Julie, mère de famille :\\n« Depuis que notre rue est devenue piétonne, les enfants jouent dehors, l'air est plus pur et on entend de nouveau les oiseaux. Les terrasses des cafés sont pleines. Une ville est faite pour ses habitants, pas pour les voitures. »\\n\\nRédigez un texte dans lequel vous présentez les deux points de vue avec vos propres mots, puis vous donnez le vôtre en le justifiant.","promptEn":"Two opinions on banning cars from the city centre. Present both in your own words, then give and justify your own view.","model":"Faut-il interdire les voitures dans les centres-villes ? Pour Luc, commerçant, une telle mesure ruinerait les petits magasins, car les clients venus de loin et les personnes qui ont du mal à marcher iraient plutôt dans les centres commerciaux. Julie, au contraire, constate qu'une rue piétonne améliore la qualité de vie : moins de pollution, plus de sécurité pour les enfants et des cafés animés.\\n\\nPour ma part, je partage plutôt l'avis de Julie, mais je comprends l'inquiétude de Luc. Dans ma ville, la rue principale est devenue piétonne il y a trois ans. Au début, plusieurs commerçants ont protesté ; aujourd'hui, ils reconnaissent que les clients restent plus longtemps.\\n\\nIl n'en reste pas moins qu'une telle décision doit être accompagnée. C'est pourquoi il me semble indispensable de prévoir des stationnements à l'entrée du centre et des navettes gratuites pour les personnes âgées."},{"id":"ee3-e","prompt":"Vous lisez ces deux opinions dans un magazine consacré à l'éducation.\\n\\nDOCUMENT 1 — Marc, directeur d'école secondaire :\\n« Rendre obligatoires quarante heures de bénévolat pour obtenir le diplôme, c'est apprendre aux jeunes la solidarité par l'expérience. Beaucoup découvrent ainsi un métier ou une passion qu'ils n'auraient jamais imaginés. »\\n\\nDOCUMENT 2 — Nadia, étudiante :\\n« Un bénévolat obligatoire n'est plus du bénévolat. Beaucoup d'élèves travaillent déjà le soir pour aider leur famille ; leur imposer des heures supplémentaires est injuste. L'engagement doit rester un choix. »\\n\\nRédigez un texte dans lequel vous présentez les deux points de vue avec vos propres mots, puis vous donnez le vôtre en le justifiant.","promptEn":"Two opinions on compulsory volunteering for high-school students. Present both in your own words, then give and justify your own view.","model":"Ces deux documents portent sur le bénévolat obligatoire au secondaire. Selon Marc, directeur d'école, imposer quelques heures d'engagement permettrait aux jeunes d'apprendre la solidarité et parfois de trouver leur vocation. Nadia estime au contraire qu'une obligation enlève tout son sens au bénévolat et pénalise les élèves qui travaillent déjà pour aider leur famille.\\n\\nPour ma part, je trouve l'idée de Marc intéressante, mais l'argument de Nadia me paraît décisif. En effet, un engagement forcé risque de devenir une simple formalité. Quand j'étais au lycée, nous devions faire un stage obligatoire : la plupart de mes camarades le vivaient comme une corvée.\\n\\nC'est pourquoi je serais plutôt favorable à une solution intermédiaire : l'école pourrait proposer et valoriser le bénévolat, par exemple en l'inscrivant sur le bulletin, sans le rendre obligatoire. Ainsi, les élèves disponibles s'engageraient par choix, et les autres ne seraient pas pénalisés."}],"phrases":[{"fr":"Ces deux documents abordent la question de…","en":"These two documents deal with…"},{"fr":"Selon le premier document, …","en":"According to the first document, …"},{"fr":"L'auteur du second document estime au contraire que…","en":"The author of the second, on the contrary, believes that…"},{"fr":"Tandis que l'un met en avant…, l'autre insiste sur…","en":"While one highlights…, the other stresses…"},{"fr":"Pour ma part, je pense que…","en":"For my part, I think that…"},{"fr":"Je partage plutôt l'avis de…, dans la mesure où…","en":"I rather agree with…, insofar as…"},{"fr":"En effet, …","en":"Indeed, … (gives a reason/proof)"},{"fr":"Par exemple, dans mon pays, …","en":"For example, in my country, …"},{"fr":"Il n'en reste pas moins que…","en":"The fact remains that…"},{"fr":"C'est pourquoi il me semble préférable de…","en":"That is why it seems better to me to…"},{"fr":"En conclusion, …","en":"In conclusion, …"}],"titleEn":"Task 3 — Compare two views, then give yours (120–180 words)","goalEn":"First summarise both documents in your own words (about 40–60 words), then give and justify your own opinion (about 80–120 words)."}]`);function _(e){let t=Object.values(e).filter(e=>typeof e==`number`);return Object.entries(e).filter(([e,n])=>t.indexOf(+e)===-1).map(([e,t])=>t)}function v(e,t=`|`){return e.map(e=>be(e)).join(t)}function y(e,t){return typeof t==`bigint`?t.toString():t}var b=class{constructor(e){this._getter=e,this._value=void 0}get value(){let e=this._getter;return e!==void 0&&(this._value=e(),this._getter=void 0),this._value}};function ee(e){return new b(e)}function te(e){return e==null}function ne(e){let t=+!!e.startsWith(`^`),n=e.endsWith(`$`)?e.length-1:e.length;return e.slice(t,n)}function re(e,t){let n=e/t,r=Math.round(n),i=4*2**-52*Math.max(Math.abs(n),1);return Math.abs(n-r)<i?0:n-r}function x(e,t,n){Object.defineProperty(e,t,{value:n,writable:!0,enumerable:!0,configurable:!0})}function ie(e){let t=Object.getOwnPropertyDescriptor(e,`shape`);return t?.get?t.get.raw:t?.value}function S(e){return ie(e._zod.def)??e._zod.def.shape - Task 2 (120–150 words): an article, letter or note for several readers, giving an account of an experience together with comments, opinions or arguments.
- Task 3 (120–180 words): a text that presents two opposing viewpoints from two short documents in the candidate's own words, then takes and justifies a position.
- Writing is marked out of 20 and converted to CEFR: 1 = A1, 2–5 = A2, 6–9 = B1, 10–13 = B2, 14–17 = C1, 18–20 = C2. For Canadian immigration, 10–11 = NCLC 7, 12–13 = NCLC 8, 14–15 = NCLC 9, 16+ = NCLC 10.
- Examiners judge three areas: language (range and accuracy of vocabulary, grammar, spelling), organisation (coherence, cohesion, development, linking words) and fit with the situation (task fully done, right reader, right register: tu/vous, formal/informal).
- A task that is not done, off topic, or far below the minimum length cannot reach the level it aims at. Note any word count outside the range.

How to mark:
- Be calibrated, not kind. Do not inflate: a text with frequent basic errors (agreement, auxiliaries, articles) is not B2, even if the ideas are good. A B2 text (10–13) is clear, organised with varied connectors, mostly accurate, and errors don't hinder understanding.
- The learner is an English speaker aiming for NCLC 7 (at least 10/20). Explanations, comments and priorities are in English; corrections and the improved version are in French.
- In "errors", copy each quote exactly as written by the learner so the app can find it. Prefer the errors that cost the most marks.
